# GeneGuessr API Worker
#
# DATA FLOW (so future-you doesn't get confused):
# ------------------------------------------------
# 1. Protein data source: Datasets/cellulore/proteins_with_demographics.json
# 2. This worker serves data from D1 via /api/protein, /api/game/bootstrap, etc.
# 3. Frontend (quartz/static/geneguessr/app.js) consumes the API
#
# Worker deployment: GitHub Actions runs `wrangler deploy` on push to main
#
# SECRETS (set via `wrangler secret put <NAME>`):
# -----------------------------------------------
# Discord OAuth (existing):
#   DISCORD_CLIENT_ID        - OAuth app client ID
#   DISCORD_CLIENT_SECRET    - OAuth app client secret
#   DISCORD_GUILD_ID         - Server ID for membership check
#
# Discord Bot (for daily recap):
#   DISCORD_PUBLIC_KEY             - Ed25519 public key for interactions validation
#   DISCORD_APPLICATION_ID         - Discord app ID (same as client ID)
#   DISCORD_BOT_TOKEN              - Bot token for REST API posting
#   DISCORD_GENEGUESSR_CHANNEL_ID  - Channel ID for posting recaps
#   BOT_CRON_TOKEN                 - Shared secret for protected recap endpoints
#
# Other:
#   DAILY_TARGET_SALT        - Salt for deterministic daily protein selection

name = "geneguessr-api"
main = "workers/index.js"
compatibility_date = "2025-11-12"
compatibility_flags = ["nodejs_compat"]

# Keep the worker off workers.dev; only serve the custom domain route.
workers_dev = false
preview_urls = false


# Custom domain routes
routes = [
  { pattern = "brinedew.bio/*", zone_name = "brinedew.bio" },
  { pattern = "brinedew.bio/api/*", zone_name = "brinedew.bio" },
  { pattern = "geneguessr.brinedew.bio/*", zone_name = "brinedew.bio" },
  { pattern = "iconoplasm.brinedew.bio/*", zone_name = "brinedew.bio" }
]

# Keep observability logs explicitly enabled across CLI deployments.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "geneguessr"
database_id = "c213abba-394b-42e0-ba15-a1b179cbe7db"

[[kv_namespaces]]
binding = "KV"
id = "7d59f063885e415ab3df5301393a114d"

[[durable_objects.bindings]]
name = "GAME_SESSIONS"
class_name = "GameSession"
script_name = "geneguessr-api"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession"]

# B-415 hard boundary: this caller worker is allowed to talk to
# THE_ONLY_ALLOWED_DB_GATEWAY, but it is not allowed to regain the Iconoplasm D1
# capability directly. If you add ICONOPLASM_DB back to this file, you are
# undoing the whole point of the gateway ceremony.
[[services]]
binding = "THE_ONLY_ALLOWED_DB_GATEWAY"
service = "the-only-allowed-db-gateway"

[[r2_buckets]]
binding = "STRUCTURES_BUCKET"
bucket_name = "geneguessr-structures"

[[r2_buckets]]
binding = "ICONOPLASM_PORTRAITS"
bucket_name = "iconoplasm-portraits"

# Cron jobs:
# - 17 minutes past every hour UTC: repair non-overridden Iconoplasm canon drift
# - 23:55 UTC pre-warm next day's target structure
# - 00:03 UTC post Discord recap (image + text) directly from Worker
[triggers]
crons = ["17 * * * *", "55 23 * * *", "3 0 * * *"]

[env.staging]
name = "geneguessr-api-staging"

# Staging should be reachable without DNS work.
workers_dev = true
preview_urls = true

# Do not claim the prod custom-domain route in staging, but do provide same-origin
# API routing for the staging site.
routes = [
  { pattern = "staging.brinedew.bio/api/*", zone_name = "brinedew.bio" }
]

# Reuse prod D1 for now (read-heavy; avoids duplicating the dataset).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "geneguessr"
database_id = "c213abba-394b-42e0-ba15-a1b179cbe7db"

# Separate KV namespace so staging does not pollute prod caches/flags.
[[env.staging.kv_namespaces]]
binding = "KV"
id = "b0394946bccf4cd3afd9e1ff6de2bedc"
preview_id = "b0394946bccf4cd3afd9e1ff6de2bedc"

# Read-only access to prod overrides so staging can mirror the live daily puzzle.
[[env.staging.kv_namespaces]]
binding = "PROD_KV"
id = "7d59f063885e415ab3df5301393a114d"
preview_id = "7d59f063885e415ab3df5301393a114d"

# Separate DO storage (keyed by worker name) so staging sessions do not touch prod.
[[env.staging.durable_objects.bindings]]
name = "GAME_SESSIONS"
class_name = "GameSession"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession"]

# Same rule in staging: the caller worker gets the service binding, not the
# Iconoplasm D1 binding. Do not use staging as the place where the old direct-DB
# architecture quietly comes back.
[[env.staging.services]]
binding = "THE_ONLY_ALLOWED_DB_GATEWAY"
service = "the-only-allowed-db-gateway-staging"

# Separate R2 bucket so staging caching does not touch prod objects.
[[env.staging.r2_buckets]]
binding = "STRUCTURES_BUCKET"
bucket_name = "geneguessr-structures-staging"
preview_bucket_name = "geneguessr-structures-staging"

[[env.staging.r2_buckets]]
binding = "ICONOPLASM_PORTRAITS"
bucket_name = "iconoplasm-portraits-staging"
preview_bucket_name = "iconoplasm-portraits-staging"

[env.staging.triggers]
crons = []
