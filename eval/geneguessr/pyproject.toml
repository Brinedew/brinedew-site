[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geneguessr-eval"
version = "0.1.0"
description = "Inspect AI eval: can LLMs identify proteins from biological clues?"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.50",
    "httpx>=0.27",
    "playwright>=1.40",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
