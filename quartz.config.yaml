# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# -----------------------------------------------------------------------------
# HOW TO ADD A NEW LOCAL BRINEDEW PLUGIN
# -----------------------------------------------------------------------------
#
# Read this before adding a new local-path plugin entry. The wrong way to do
# it blocks production deploys with ENOENT and costs hours of debugging.
# See B-567 (closed) for the full postmortem of how this got broken before.
#
# A "local" plugin is one that ships in this repo, not pulled from GitHub.
# Each local plugin MUST be a real directory at the path the config points
# at. Specifically:
#
#   1. The plugin source dir must exist on disk and contain:
#        package.json          (with `quartz.components.<Name>` declared)
#        dist/index.js         (the built component)
#        dist/index.d.ts       (the types)
#      The shared components live in .quartz/local-plugins/<name>/ and are
#      re-bundled from the canonical .quartz/plugins/brinedew-components/
#      source via `pnpm --filter @brinedew/<name> build` from the
#      brinedew-components package.
#
#   2. Add a config entry like:
#
#        - source:
#            name: <name>
#            repo: ./.quartz/local-plugins/<name>
#          enabled: true
#          order: <int>
#
#   3. DO NOT commit a symlink at .quartz/plugins/<name> in git. The
#      Quartz v5 install code (quartz/cli/plugin-git-handlers.js) creates
#      local-plugin symlinks at runtime on the runner with a path that
#      resolves on the runner's filesystem. If you commit a symlink with
#      a host-specific absolute target (e.g. "D:/Coding/.../...") it will
#      be a Windows-absolute path that does not exist on the Linux CI
#      runner, and the install step will fail with ENOENT inside
#      regeneratePluginIndex at quartz/cli/plugin-git-handlers.js:250
#      (fs.statSync on the symlink follows it to a path that doesn't
#      resolve).
#
#   4. The .gitignore already lists every installed plugin dir, so a
#      runner-created symlink under .quartz/plugins/<name> will never
#      be committed. That is the desired behavior. Let the install
#      code own those entries.
#
#   5. If you ever need a symlink at .quartz/plugins/<name> in git (you
#      don't, see #3), use a RELATIVE target like:
#
#        ../../local-plugins/<name>
#
#      Never commit a Windows-absolute or any other host-absolute path.
#      The previous symlink in git had target
#      "D:/Coding/Website/.quartz/local-plugins/draft-tag-injector"
#      which works on Vladimir's PC and nowhere else.
#
#   6. If the install step ever reports "Linked <name> (local)" but
#      the build then fails with ENOENT inside regeneratePluginIndex,
#      the first thing to check is whether .quartz/plugins/<name> is a
#      pre-existing symlink with a target that doesn't resolve on the
#      current host. That is what B-567 was.
#
# Reference paths in this repo:
#   - quartz/cli/plugin-git-handlers.js:245-251  regeneratePluginIndex ENOENT
#   - quartz/cli/plugin-git-handlers.js:610-630  local symlink creation
#   - quartz/cli/helpers.js:67-84                symlinkOrCopySync (swallows EEXIST)
#   - .quartz/local-plugins/<name>/              per-plugin source dirs
#   - .quartz/plugins/brinedew-components/       canonical bundled source
#   - .gitignore                                lists every installed plugin dir
#
# -----------------------------------------------------------------------------
configuration:
  pageTitle: Brinedew
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  locale: en-US
  baseUrl: brinedew.bio
  ignorePatterns:
    - private
    - Templates
    - .obsidian
    - .trash
    - .stfolder
    - .gemini
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Crimson Pro
      body: Crimson Pro
      code: Monaspace Xenon Web
    colors:
      lightMode:
        light: oklch(96% 0.015 75)
        lightgray: oklch(85% 0.02 65)
        gray: oklch(70% 0.025 60)
        darkgray: oklch(45% 0.03 55)
        dark: oklch(20% 0.035 50)
        secondary: oklch(40% 0.04 55)
        tertiary: oklch(50% 0.08 185)
        highlight: "#8f9fa926"
        textHighlight: "#ffea0059"
      darkMode:
        light: oklch(16% 0.01 45)
        lightgray: oklch(36% 0.02 50)
        gray: oklch(58% 0.025 55)
        darkgray: oklch(80% 0.02 60)
        dark: oklch(85% 0.015 65)
        secondary: oklch(70% 0.02 60)
        tertiary: oklch(68% 0.08 185)
        highlight: "#8f9fa926"
        textHighlight: "#7dd3fc40"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: false
  - source: github:quartz-community/remove-draft
    enabled: false
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
    options:
      domain: brinedew.bio
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # explorer disabled — live site uses custom nav
  - source: github:quartz-community/graph
    enabled: false
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: false
  - source: github:quartz-community/article-title
    enabled: false
  - source: github:quartz-community/content-meta
    enabled: false
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
      group: toolbar
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: false
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        About: /About.html
        Support me: /posts/Support-me.html
  # Contact form for the brinedew.bio About page. Opt-in via the
  # `contact: true` frontmatter on content/About.md. The form posts to
  # /api/contact on the stateful worker, which delivers via Cloudflare
  # Email Sending to contact@brinedew.bio -> Email Routing -> your inbox.
  - source:
      name: contact-form
      repo: ./.quartz/local-plugins/contact-form
    enabled: true
    order: 24
    options:
      endpoint: /api/contact
    layout:
      position: afterBody
      priority: 15
  - source: github:quartz-community/recent-notes
    enabled: false
  - source:
      name: homepage-crawl-frontier
      repo: ./.quartz/local-plugins/homepage-crawl-frontier
    enabled: true
    order: 24
    layout:
      position: afterBody
      priority: 10
  - source:
      name: iconoplasm-page-switcher
      repo: ./.quartz/local-plugins/iconoplasm-page-switcher
    enabled: true
    order: 24
    layout:
      position: left
      priority: 38
  - source:
      name: tag-sections
      repo: ./.quartz/local-plugins/tag-sections
    enabled: true
    order: 24
    layout:
      position: left
      priority: 40
  - source:
      name: draft-tag-injector
      repo: ./.quartz/local-plugins/draft-tag-injector
    enabled: true
    order: 45
  - source:
      name: image-captions
      repo: ./.quartz/local-plugins/image-captions
    enabled: true
    order: 25
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      hidePropertiesView: true
  # quartz-themes disabled — conflicts with our custom theme colors
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
    content: {}
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
    canvas: {}
    bases: {}
