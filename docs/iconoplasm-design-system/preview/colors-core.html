<!-- @dsCard group="Colors" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head><body><div class="card">
  <div class="kicker">Core palette · paper &amp; ink</div>
  <div class="row">
    <div class="swatch" style="background:var(--paper)"><span class="name" style="color:var(--ink)">Paper</span><span class="hex" style="color:var(--ink)">#F4EDE5</span></div>
    <div class="swatch" style="background:var(--paper-2)"><span class="name" style="color:var(--ink)">Paper 2</span><span class="hex" style="color:var(--ink)">#EFE6D9</span></div>
    <div class="swatch" style="background:var(--ink)"><span class="name" style="color:var(--paper)">Ink</span><span class="hex" style="color:var(--paper)">#20120B</span></div>
    <div class="swatch" style="background:var(--ink-soft)"><span class="name" style="color:var(--paper)">Ink soft</span><span class="hex" style="color:var(--paper)">#34241B</span></div>
    <div class="swatch" style="background:var(--pen)"><span class="name" style="color:#fff">Pen · teal</span><span class="hex" style="color:#fff">#1B7269</span></div>
    <div class="swatch" style="background:var(--stamp)"><span class="name" style="color:#fff">Stamp · rust</span><span class="hex" style="color:#fff">#A24834</span></div>
  </div>
  <div class="kicker">One accent only — the teal pen. Rust is for stamps/QC, used sparingly.</div>
</div></body></html>
