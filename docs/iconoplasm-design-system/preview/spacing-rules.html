<!-- @dsCard group="Spacing" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head><body><div class="card">
  <div class="kicker">Hairline rule system · the card IS a grid of these</div>
  <div style="border:1px solid var(--rule-strong);background:var(--paper)">
    <div style="display:grid;grid-template-columns:120px 1fr">
      <div style="padding:8px 10px;border-right:1px solid var(--rule);font-family:var(--font-label);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)">FULL NAME</div>
      <div style="padding:8px 10px;font-family:var(--font-type);font-size:16px">insulin</div>
    </div>
    <div style="border-top:1px solid var(--rule);display:grid;grid-template-columns:120px 1fr">
      <div style="padding:8px 10px;border-right:1px solid var(--rule);font-family:var(--font-label);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)">FAMILY</div>
      <div style="padding:8px 10px;font-family:var(--font-type);font-size:16px">INS</div>
    </div>
  </div>
  <div class="row" style="gap:20px">
    <span class="kicker">--rule · rgba(32,18,11,.16)</span>
    <span class="kicker">--rule-strong · rgba(32,18,11,.26)</span>
  </div>
</div></body></html>
