<!-- @dsCard group="Spacing" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>.el{flex:1;height:78px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;display:flex;align-items:flex-end;padding:7px}</style>
</head><body><div class="card">
  <div class="kicker">Elevation · soft &amp; low — cards stay grounded, never float</div>
  <div class="row">
    <div class="el" style="box-shadow:none"><span class="kicker">flat</span></div>
    <div class="el" style="box-shadow:var(--shadow-soft)"><span class="kicker">soft · popup</span></div>
    <div class="el" style="box-shadow:var(--shadow-card)"><span class="kicker">card</span></div>
    <div class="el" style="box-shadow:var(--shadow-pop)"><span class="kicker">tooltip pop</span></div>
  </div>
  <div class="kicker">No big lift shadows. Tooltip adds a 1px hairline ring so it sits ON the page.</div>
</div></body></html>
