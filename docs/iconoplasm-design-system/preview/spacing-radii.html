<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head><body><div class="card">
  <div class="kicker">Corner radii · two worlds</div>
  <div class="row" style="align-items:flex-end">
    <div class="col" style="flex:1;align-items:center;gap:8px">
      <div style="width:100%;height:60px;background:var(--paper-2);border:1px solid var(--rule-strong);border-radius:0"></div>
      <div class="kicker">Printed card · 0</div>
    </div>
    <div class="col" style="flex:1;align-items:center;gap:8px">
      <div style="width:100%;height:60px;background:var(--paper-2);border:1px solid var(--rule-strong);border-radius:4px"></div>
      <div class="kicker">Simple tooltip · 4</div>
    </div>
    <div class="col" style="flex:1;align-items:center;gap:8px">
      <div style="width:100%;height:60px;background:var(--paper-2);border:1px solid var(--rule-strong);border-radius:10px"></div>
      <div class="kicker">Input / segment · 10</div>
    </div>
    <div class="col" style="flex:1;align-items:center;gap:8px">
      <div style="width:100%;height:60px;background:var(--paper-2);border:1px solid var(--rule-strong);border-radius:14px"></div>
      <div class="kicker">Popup section · 14</div>
    </div>
  </div>
  <div class="kicker">The printed specimen sheet is ALWAYS square. Only soft chrome rounds.</div>
</div></body></html>
