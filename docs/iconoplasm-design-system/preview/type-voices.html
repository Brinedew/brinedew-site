<!-- @dsCard group="Type" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head><body><div class="card">
  <div class="kicker">Four voices · strict jobs</div>
  <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:baseline">
    <div style="font-family:var(--font-symbol);font-weight:800;font-size:32px;letter-spacing:-0.05em;line-height:0.9">TP53</div>
    <div class="kicker" style="align-self:center">League Spartan 800 — the gene symbol</div>

    <div style="font-family:var(--font-label);font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)">FULL NAME</div>
    <div class="kicker" style="align-self:center">IBM Plex Mono — pre-printed field labels (gene-independent)</div>

    <div style="font-family:var(--font-type);font-size:20px;letter-spacing:0.03em">tumor protein p53</div>
    <div class="kicker" style="align-self:center">Special Elite — typewritten molecular values</div>

    <div style="font-family:var(--font-hand);font-size:28px;color:var(--pen);transform:rotate(-3deg)">guardian of the genome</div>
    <div class="kicker" style="align-self:center">Caveat — handwritten human-trait notes (teal pen)</div>
  </div>
</div></body></html>
