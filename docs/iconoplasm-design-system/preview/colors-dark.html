<!-- @dsCard group="Colors" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head><body><div class="card">
  <div class="kicker">Optional dark skins</div>
  <div class="row">
    <div class="swatch" style="background:var(--drab-paper)"><span class="name" style="color:var(--drab-ink)">Neo-drab paper</span><span class="hex" style="color:var(--drab-ink)">#171A14</span></div>
    <div class="swatch" style="background:var(--drab-ink)"><span class="name" style="color:var(--drab-paper)">Drab ink</span><span class="hex" style="color:var(--drab-paper)">#EDE2B5</span></div>
    <div class="swatch" style="background:var(--drab-pen)"><span class="name" style="color:#1a1a0e">Sodium accent</span><span class="hex" style="color:#1a1a0e">#D7B642</span></div>
    <div class="swatch" style="background:var(--stage)"><span class="name" style="color:var(--stage-ink)">Promo stage</span><span class="hex" style="color:var(--stage-ink)">#161616</span></div>
    <div class="swatch" style="background:var(--stage-muted)"><span class="name" style="color:#161616">Stage muted</span><span class="hex" style="color:#161616">#9A948A</span></div>
  </div>
  <div class="kicker">Neo-drab = "sodium dossier" hover-card skin. Promo stage = marketing backdrop.</div>
</div></body></html>
