# Pages must read a Pages-shaped wrangler.toml from its own working directory.
# Keep this file minimal and separate from the root Worker config, then copy it into
# the CI temp directory used for `wrangler pages deploy`.
name = "brinedew-bio"
# compatibility_date matches wrangler.toml. Cloudflare Pages reads the
# compat date from this file when deploy-quartz.yml copies it into
# .wrangler-pages/ before `wrangler pages deploy`. Use the runner's UTC
# date, not the local date — Cloudflare rejects future-dated configs.
compatibility_date = "2026-06-28"
pages_build_output_dir = "../public"
