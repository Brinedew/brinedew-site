name = "the-only-allowed-public-edge-worker-that-must-not-touch-state"
main = "workers/the-only-allowed-public-edge-worker-that-must-not-touch-state.js"
# compatibility_date bumped to 2026-06-29 to match the root wrangler.toml.
# This file is the upload-only path for the public edge Worker and is
# expected to be the deployment source for the same Worker the root
# wrangler.toml describes. See wrangler.toml for the rationale comment.
compatibility_date = "2026-06-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[services]]
binding = "THE_ONLY_ALLOWED_STATEFUL_WORKER_DO_NOT_DUPLICATE"
service = "geneguessr-api"

[env.staging]
name = "the-only-allowed-public-edge-worker-that-must-not-touch-state-staging"
workers_dev = true
preview_urls = true

[[env.staging.services]]
binding = "THE_ONLY_ALLOWED_STATEFUL_WORKER_DO_NOT_DUPLICATE"
service = "geneguessr-api-staging"
