# GeneGuessr Benchmark API Worker
#
# Separate Worker from the main geneguessr-api to isolate benchmark traffic.
# Shares the same D1 database (reads protein data, writes benchmark tables).
#
# Deploy: wrangler deploy --config workers/benchmark/wrangler.toml
# Dev:    wrangler dev --config workers/benchmark/wrangler.toml
#
# Secrets (set via `wrangler secret put <NAME> --config workers/benchmark/wrangler.toml`):
#   (none yet — API keys live in D1 benchmark_api_keys table)

name = "the-only-allowed-public-benchmark-edge-worker-that-must-not-touch-state"
main = "the-only-allowed-public-benchmark-edge-worker-that-must-not-touch-state.js"
compatibility_date = "2025-11-12"

workers_dev = false
preview_urls = false

routes = [
  { pattern = "geneguessr-bench.brinedew.bio/*", zone_name = "brinedew.bio" }
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# This public benchmark worker must not regain direct DB access. It forwards to
# the one internal worker that is allowed to touch state.
[[services]]
binding = "THE_ONLY_ALLOWED_STATEFUL_WORKER_DO_NOT_DUPLICATE"
service = "geneguessr-api"

# --- Staging ---
[env.staging]
name = "the-only-allowed-public-benchmark-edge-worker-that-must-not-touch-state-staging"
workers_dev = true
preview_urls = true

routes = []

[[env.staging.services]]
binding = "THE_ONLY_ALLOWED_STATEFUL_WORKER_DO_NOT_DUPLICATE"
service = "geneguessr-api-staging"
