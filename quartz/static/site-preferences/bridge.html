<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brinedew Settings Bridge</title>
  </head>
  <body>
    <script>
      ;(function () {
        "use strict"

        var CHANNEL = "brinedew-site-preferences-bridge"
        var AUTH_CHANNEL = "brinedew-shared-auth-bridge"
        var STORAGE_KEY = "brinedew.iconoplasm.settings.v1"
        var DEFAULTS = {
          homeLayout: "bricks",
          cardVariant: "image-only",
          showAllGenes: false,
        }

        function normalizeHomeLayout(layout) {
          return String(layout || "")
            .trim()
            .toLowerCase() === "masonry"
            ? "masonry"
            : "bricks"
        }

        function normalizeCardVariant(variant) {
          var value = String(variant || "")
            .trim()
            .toLowerCase()
          if (value === "image-only") return "image-only"
          if (value === "neo-drab") return "lit-archival"
          if (value === "lab-label" || value === "lit-archival") return "lit-archival"
          if (value === "classic" || value === "simple") return "simple"
          return DEFAULTS.cardVariant
        }

        function normalizeBooleanSetting(value) {
          if (value === true) return true
          var normalized = String(value || "")
            .trim()
            .toLowerCase()
          return (
            normalized === "true" ||
            normalized === "1" ||
            normalized === "yes" ||
            normalized === "on"
          )
        }

        function buildIconoplasmSettings(raw) {
          var source = raw && typeof raw === "object" ? raw : {}
          return {
            homeLayout: normalizeHomeLayout(source.homeLayout),
            cardVariant: normalizeCardVariant(source.cardVariant),
            showAllGenes: normalizeBooleanSetting(source.showAllGenes),
          }
        }

        function hasLegacyIconoplasmProviderSettings(raw) {
          if (!raw || typeof raw !== "object") return false
          return (
            Object.prototype.hasOwnProperty.call(raw, "generationApiKey") ||
            Object.prototype.hasOwnProperty.call(raw, "generationProvider") ||
            Object.prototype.hasOwnProperty.call(raw, "generationModel") ||
            Object.prototype.hasOwnProperty.call(raw, "generationEndpoint")
          )
        }

        function allowedOrigin(origin) {
          try {
            var url = new URL(String(origin || ""))
            var host = String(url.hostname || "").toLowerCase()
            return (
              host === "brinedew.bio" ||
              host.endsWith(".brinedew.bio") ||
              host === "localhost" ||
              host === "127.0.0.1"
            )
          } catch (_err) {
            return false
          }
        }

        function readStoredSettings() {
          try {
            var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null")
            var settings = buildIconoplasmSettings(raw)
            if (hasLegacyIconoplasmProviderSettings(raw)) {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(settings))
            }
            return settings
          } catch (_err) {
            return buildIconoplasmSettings(DEFAULTS)
          }
        }

        function writeStoredSettings(value) {
          var nextSettings = buildIconoplasmSettings(value || DEFAULTS)
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextSettings))
          return nextSettings
        }

        function resetStoredSettings() {
          localStorage.removeItem(STORAGE_KEY)
          return buildIconoplasmSettings(DEFAULTS)
        }

        function respond(target, origin, id, ok, payload) {
          if (!target || typeof target.postMessage !== "function" || !id) return
          target.postMessage(
            {
              channel: CHANNEL,
              id: id,
              ok: ok,
              payload: payload || null,
            },
            origin,
          )
        }

        function respondAuth(target, origin, id, ok, payload) {
          if (!target || typeof target.postMessage !== "function" || !id) return
          target.postMessage(
            {
              channel: AUTH_CHANNEL,
              id: id,
              ok: ok,
              payload: payload || null,
            },
            origin,
          )
        }

        function readAuthState() {
          return fetch("/api/auth/me", {
            credentials: "include",
          })
            .then(function (response) {
              if (!response.ok) return null
              return response.json().catch(function () {
                return null
              })
            })
            .then(function (payload) {
              if (!payload || !payload.authenticated || !payload.user) return null
              return payload.user
            })
        }

        function logoutAuthState() {
          return fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          }).then(function (response) {
            if (!response.ok && response.status !== 204) {
              throw new Error("Logout failed")
            }
            return true
          })
        }

        window.addEventListener("message", function (event) {
          var data = event && event.data ? event.data : null
          if (!data || !allowedOrigin(event.origin)) return

          try {
            if (data.channel === AUTH_CHANNEL) {
              if (data.type === "fetchAuthenticatedUser") {
                readAuthState()
                  .then(function (user) {
                    respondAuth(event.source, event.origin, data.id, true, user)
                  })
                  .catch(function (error) {
                    respondAuth(event.source, event.origin, data.id, false, {
                      error: error && error.message ? error.message : "Unknown auth bridge error",
                    })
                  })
                return
              }
              if (data.type === "logoutAuthenticatedUser") {
                logoutAuthState()
                  .then(function () {
                    respondAuth(event.source, event.origin, data.id, true, true)
                  })
                  .catch(function (error) {
                    respondAuth(event.source, event.origin, data.id, false, {
                      error: error && error.message ? error.message : "Unknown auth bridge error",
                    })
                  })
                return
              }
              respondAuth(event.source, event.origin, data.id, false, {
                error: "Unsupported auth bridge request",
              })
              return
            }
            if (data.channel !== CHANNEL) return

            if (data.type === "readIconoplasmSettings") {
              respond(event.source, event.origin, data.id, true, readStoredSettings())
              return
            }
            if (data.type === "writeIconoplasmSettings") {
              respond(event.source, event.origin, data.id, true, writeStoredSettings(data.payload))
              return
            }
            if (data.type === "resetIconoplasmSettings") {
              respond(event.source, event.origin, data.id, true, resetStoredSettings())
              return
            }
            respond(event.source, event.origin, data.id, false, {
              error: "Unsupported bridge request",
            })
          } catch (error) {
            respond(event.source, event.origin, data.id, false, {
              error: error && error.message ? error.message : "Unknown bridge error",
            })
          }
        })
      })()
    </script>
  </body>
</html>
