# ARCHITECTURE FENCE [IPD-009]: this config and its loud source filenames are
# executable ownership guards. Keep the single script, route, and state owner
# aligned with cloudflare/deployment-topology.json.
# This is the only worker in the repo that is allowed to hold dangerous state
# bindings. Shared public workers call it through an absurdly explicit service
# binding instead of regaining D1/KV/R2/session power themselves. Iconoplasm
# routes here directly because matching static assets short-circuit before
# Worker execution and a proxy hop would double-meter every dynamic request.
#
# The Cloudflare script name intentionally stays `geneguessr-api` so the existing
# secret set and GameSession durable object ownership remain attached during the
# cutover. The file name and binding names carry the loud safety annotation.

name = "geneguessr-api"
main = "workers/the-only-allowed-internal-stateful-worker-runtime-do-not-duplicate.js"
compatibility_date = "2025-11-12"
compatibility_flags = ["nodejs_compat"]
# Cron triggers need workers_dev=true to fire. The public edge worker owns
# production routes; this worker is only publicly reachable via service binding.
workers_dev = true
preview_urls = false

# ARCHITECTURE FENCE [IPD-007]: Iconoplasm is static-first on the Free plan. Matching files are served by
# Cloudflare's asset layer without invoking this Worker; only dynamic misses
# enter the stateful runtime. Direct ownership also removes the previous second
# public-proxy invocation from every dynamic request.
# Do not enable Workers Cache here or in env/exports: its cache HITs are metered,
# including otherwise free static assets (July 2026 pricing). The deployment
# topology validator rejects it. This is not the same as Workers Static Assets.
routes = [{ pattern = "iconoplasm.brinedew.bio/*", zone_name = "brinedew.bio" }]

[assets]
directory = "./public-iconoplasm-edge"
not_found_handling = "none"
run_worker_first = [
  "/api/*",
  "/portraits/*",
  "/published-cards/v2/immutable/*",
  "/admin*",
  "/blocklist*",
  "/artist-styles*",
  "/health",
  "/gene/*",
  "/genes*",
  "/sitemap*",
  "/robots.txt",
  "/llms.txt"
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[browser]
binding = "ICONOPLASM_PRINT_COPY_BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "geneguessr"
database_id = "c213abba-394b-42e0-ba15-a1b179cbe7db"

[[d1_databases]]
binding = "ICONOPLASM_DB"
database_name = "iconoplasm"
database_id = "e7b2e2ca-8fa4-4a0a-bae1-9917912aa7ff"
migrations_dir = "migrations-iconoplasm"

# ARCHITECTURE FENCE [IPD-012]: caretaker assignments, immutable manifestation
# lineage, canonical selection, command receipts, and replication events share
# one private transactional authority. Large encrypted bodies live in Bunny;
# neither history nor competing mutable prose belongs in the primary D1.
[[d1_databases]]
binding = "ICONOPLASM_AUTHORING_DB"
database_name = "iconoplasm-authoring"
database_id = "1ac27eba-5a08-4d8a-b5b2-99ed4254abd0"
migrations_dir = "migrations-iconoplasm-authoring"

# ARCHITECTURE FENCE [IPD-005]: immutable audit history is copied here before
# bounded retention deletes it from the operational Iconoplasm database.
[[d1_databases]]
binding = "ICONOPLASM_AUDIT_DB"
database_name = "iconoplasm-audit"
database_id = "43f485e3-a933-4345-b2f4-7c5ec1aaee6f"

[[kv_namespaces]]
binding = "KV"
id = "7d59f063885e415ab3df5301393a114d"

# Anonymous public-route abuse control. These counters are local to each
# Cloudflare location and eventually consistent; they are not billing ledgers.
# They live on the route-owning Worker so every dynamic request is limited once.
[[ratelimits]]
name = "PUBLIC_RATE_LIMIT_5"
namespace_id = "655005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "PUBLIC_RATE_LIMIT_60"
namespace_id = "655060"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PUBLIC_RATE_LIMIT_120"
namespace_id = "655120"
simple = { limit = 120, period = 60 }

[[durable_objects.bindings]]
name = "GAME_SESSIONS"
class_name = "GameSession"
script_name = "geneguessr-api"

[[durable_objects.bindings]]
name = "ICONOPLASM_VOTE_COORDINATORS"
class_name = "IconoplasmVoteCoordinator"

[[durable_objects.bindings]]
name = "ICONOPLASM_D1_DAILY_BUDGET_KILL_SWITCH_DO_NOT_DUPLICATE"
class_name = "IconoplasmD1DailyBudgetKillSwitchDoNotDuplicate"

[[durable_objects.bindings]]
name = "ICONOPLASM_SYNC_GOVERNOR"
class_name = "IconoplasmSyncGovernor"

[[durable_objects.bindings]]
name = "ICONOPLASM_CARD_PUBLICATION"
class_name = "IconoplasmCardPublicationCoordinator"

[[queues.producers]]
binding = "ICONOPLASM_SYNC_FINALIZATION_QUEUE"
queue = "iconoplasm-sync-finalization"

[[queues.producers]]
binding = "ICONOPLASM_VOTE_PROJECTION_QUEUE"
queue = "iconoplasm-vote-projection"

[[queues.producers]]
binding = "ICONOPLASM_GENE_CARD_MATERIALIZATION_QUEUE"
queue = "iconoplasm-gene-card-materialization"

[[queues.consumers]]
queue = "iconoplasm-sync-finalization"
# ARCHITECTURE FENCE [IPD-004]: consumer retries and producer replacements
# follow durable due times; this default is only a transport-failure fallback.
dead_letter_queue = "iconoplasm-sync-dlq"
max_batch_size = 100
max_batch_timeout = 1
max_retries = 5
retry_delay = 30

[[queues.consumers]]
queue = "iconoplasm-vote-projection"
dead_letter_queue = "iconoplasm-vote-projection-dlq"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 5
retry_delay = 30

[[queues.consumers]]
queue = "iconoplasm-gene-card-materialization"
# ARCHITECTURE FENCE [IPD-004]: one message wakes one leased D1 row. Serialized
# delivery also keeps Browser Rendering below its launch/concurrency envelope.
dead_letter_queue = "iconoplasm-gene-card-materialization-dlq"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 30
max_concurrency = 1

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IconoplasmVoteCoordinator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["IconoplasmD1DailyBudgetKillSwitchDoNotDuplicate"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["IconoplasmSyncGovernor"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["IconoplasmCardPublicationCoordinator"]

# Cloudflare Email Service send binding.
# Used by the site-wide /api/contact endpoint to deliver contact-form submissions
# from no-reply@brinedew.bio -> contact@brinedew.bio (which Email Routing forwards
# to brinedew@proton.me). Token used by the deploy workflow must have the
# "Email Sending" scope.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "brinedew@proton.me"
allowed_sender_addresses = ["noreply@brinedew.bio", "contact@brinedew.bio"]

[vars]
# Billing guardrail model:
# 1) hard monthly stop near the included PAYGO allowance, and
# 2) smart daily allowance derived from monthly remaining budget and days left in
#    the current cycle so low-spend months can absorb intermittent viral days.
ICONOPLASM_D1_ROWS_READ_HARD_MONTHLY_BUDGET_DO_NOT_SET_CASUALLY = "24000000000"
ICONOPLASM_D1_ROWS_WRITTEN_HARD_MONTHLY_BUDGET_DO_NOT_SET_CASUALLY = "40000000"
ICONOPLASM_D1_BILLING_CYCLE_DAY_OF_MONTH_DO_NOT_SET_CASUALLY = "7"
ICONOPLASM_D1_DAILY_BURST_MULTIPLIER_DO_NOT_SET_CASUALLY = "3"
ICONOPLASM_D1_DATABASE_STORAGE_HARD_LIMIT_BYTES_DO_NOT_SET_CASUALLY = "500000000"
ICONOPLASM_D1_DATABASE_STORAGE_TARGET_PERCENT_DO_NOT_SET_CASUALLY = "80"
ICONOPLASM_CARD_CATALOG_BUDGET_PREFLIGHT_REQUIRED = "1"
ICONOPLASM_CARD_CATALOG_KV_WRITE_BUDGET_REQUIRED_DO_NOT_SET_CASUALLY = "1"
ICONOPLASM_CARD_CATALOG_DAILY_KV_WRITE_BUDGET_DO_NOT_SET_CASUALLY = "900"
# ARCHITECTURE FENCE [IPD-001]: Bunny is the healthy-path direct portrait
# origin. Regional DNS failure belongs to the one-probe canonical fallback;
# removing this value shifts all portrait reads onto the Worker budget.
# Extension Cache Storage reuses bytes across websites; misses retain this provider.
ICONOPLASM_EXTERNAL_PORTRAIT_CDN_BASE_URL = "https://iconoplasmportraits.b-cdn.net"
ICONOPLASM_EXTERNAL_PORTRAIT_STORAGE_HOST = "storage.bunnycdn.com"
ICONOPLASM_EXTERNAL_PORTRAIT_STORAGE_ZONE = "iconoplasm-portraits"
# ARCHITECTURE FENCE [IPD-012]: authoring reads use authenticated Storage only.
# The dedicated private zone has no Pull Zone and contains only ciphertext under
# opaque private locators; portrait credentials are never an authoring fallback.
ICONOPLASM_AUTHORING_STORAGE_HOST = "storage.bunnycdn.com"
ICONOPLASM_AUTHORING_STORAGE_ZONE = "iconoplasm-authoring"
# Manifestation authority bearer secrets are deliberately separate Worker
# secrets. Never reuse one value across audiences and never restore the retired
# generic service token:
#   ICONOPLASM_AUTHORITY_REPLICA_TOKEN      events, snapshots, exact material, Tags
#   ICONOPLASM_AUTHORITY_GENERATION_TOKEN   generation claim/renew/fail/complete
#   ICONOPLASM_AUTHORITY_MAINTENANCE_TOKEN  externally invoked bounded maintenance
#   ICONOPLASM_AUTHORITY_BACKUP_TOKEN       backup capability/export/restore/verify
#   ICONOPLASM_AUTHORITY_CUTOVER_TOKEN      one-time cutover lifecycle only
# Separate private, no-Pull-Zone cutover recovery storage. Its password is the
# ICONOPLASM_AUTHORING_BACKUP_STORAGE_PASSWORD Worker secret; never fall back.
ICONOPLASM_AUTHORING_BACKUP_STORAGE_HOST = "storage.bunnycdn.com"
ICONOPLASM_AUTHORING_BACKUP_STORAGE_ZONE = "iconoplasm-authoring-backup"
ICONOPLASM_AUTHORING_BODY_KEY_VERSION = "1"
DISCORD_FEED_CHANNEL_ID = "1523072467638288455"

# Temporary no-R2 hotfix: Cloudflare is currently rejecting worker version
# uploads with code 10136/10136-style binding failures because this account no
# longer has R2 enabled. That is not just a random toggle state: the current
# billing/card path is blocked, so "just use R2" is not a live portrait-storage
# fix right now. Leave these bindings commented out until R2 is actually
# restored, otherwise even a structure-fallback worker cannot deploy.
#[[r2_buckets]]
#binding = "STRUCTURES_BUCKET"
#bucket_name = "geneguessr-structures"

#[[r2_buckets]]
#binding = "ICONOPLASM_PORTRAITS"
#bucket_name = "iconoplasm-portraits"

[triggers]
# "55 23" is the sole full Iconoplasm maintenance owner (vote projection + canon
# repair + gallery refresh) and also pre-warms tomorrow's GeneGuessr target.
# "3 0" posts/catches up GeneGuessr recaps; it must not repeat Iconoplasm
# maintenance. "6 12" posts the GeneGuessr feed. "*/15" is a cheap Iconoplasm
# gallery-refresh-only tick so a canon change reaches public clients within
# ~15min. Clean ticks reuse the published version.
crons = ["55 23 * * *", "3 0 * * *", "6 12 * * *", "*/15 * * * *"]

