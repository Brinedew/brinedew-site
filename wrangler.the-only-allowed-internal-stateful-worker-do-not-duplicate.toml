# This is the only worker in the repo that is allowed to hold dangerous state
# bindings. Public workers must call it through an absurdly explicit service
# binding instead of regaining D1/KV/R2/session power themselves.
#
# The Cloudflare script name intentionally stays `geneguessr-api` so the existing
# secret set and GameSession durable object ownership remain attached during the
# cutover. The file name and binding names carry the loud safety annotation.

name = "geneguessr-api"
main = "workers/the-only-allowed-internal-stateful-worker-runtime-do-not-duplicate.js"
compatibility_date = "2025-11-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "geneguessr"
database_id = "c213abba-394b-42e0-ba15-a1b179cbe7db"

[[d1_databases]]
binding = "ICONOPLASM_DB"
database_name = "iconoplasm"
database_id = "e7b2e2ca-8fa4-4a0a-bae1-9917912aa7ff"
migrations_dir = "migrations-iconoplasm"

[[kv_namespaces]]
binding = "KV"
id = "7d59f063885e415ab3df5301393a114d"

[[durable_objects.bindings]]
name = "GAME_SESSIONS"
class_name = "GameSession"
script_name = "geneguessr-api"

[[durable_objects.bindings]]
name = "ICONOPLASM_VOTE_COORDINATORS"
class_name = "IconoplasmVoteCoordinator"

[[durable_objects.bindings]]
name = "ICONOPLASM_D1_DAILY_BUDGET_KILL_SWITCH_DO_NOT_DUPLICATE"
class_name = "IconoplasmD1DailyBudgetKillSwitchDoNotDuplicate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IconoplasmVoteCoordinator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["IconoplasmD1DailyBudgetKillSwitchDoNotDuplicate"]

[vars]
# This is a hard stop, not an alert. Recent normal days sat around ~106M-115M
# D1 rows read, while the bill came from multi-billion-row days. Keep the cap
# comfortably above normal traffic and far below runaway query explosions.
ICONOPLASM_D1_ROWS_READ_HARD_DAILY_BUDGET_DO_NOT_SET_CASUALLY = "300000000"
ICONOPLASM_D1_ROWS_WRITTEN_HARD_DAILY_BUDGET_DO_NOT_SET_CASUALLY = "1000000"

[[r2_buckets]]
binding = "STRUCTURES_BUCKET"
bucket_name = "geneguessr-structures"

[[r2_buckets]]
binding = "ICONOPLASM_PORTRAITS"
bucket_name = "iconoplasm-portraits"

[triggers]
crons = ["17 * * * *", "55 23 * * *", "3 0 * * *"]

[env.staging]
name = "geneguessr-api-staging"
workers_dev = false
preview_urls = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "geneguessr"
database_id = "c213abba-394b-42e0-ba15-a1b179cbe7db"

[[env.staging.d1_databases]]
binding = "ICONOPLASM_DB"
database_name = "iconoplasm-staging"
database_id = "3d1c101a-f1e7-47bc-a1c6-c60c147191ec"
migrations_dir = "migrations-iconoplasm"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "b0394946bccf4cd3afd9e1ff6de2bedc"
preview_id = "b0394946bccf4cd3afd9e1ff6de2bedc"

[[env.staging.kv_namespaces]]
binding = "PROD_KV"
id = "7d59f063885e415ab3df5301393a114d"
preview_id = "7d59f063885e415ab3df5301393a114d"

[[env.staging.durable_objects.bindings]]
name = "GAME_SESSIONS"
class_name = "GameSession"

[[env.staging.durable_objects.bindings]]
name = "ICONOPLASM_VOTE_COORDINATORS"
class_name = "IconoplasmVoteCoordinator"

[[env.staging.durable_objects.bindings]]
name = "ICONOPLASM_D1_DAILY_BUDGET_KILL_SWITCH_DO_NOT_DUPLICATE"
class_name = "IconoplasmD1DailyBudgetKillSwitchDoNotDuplicate"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["IconoplasmVoteCoordinator"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["IconoplasmD1DailyBudgetKillSwitchDoNotDuplicate"]

[env.staging.vars]
ICONOPLASM_D1_ROWS_READ_HARD_DAILY_BUDGET_DO_NOT_SET_CASUALLY = "50000000"
ICONOPLASM_D1_ROWS_WRITTEN_HARD_DAILY_BUDGET_DO_NOT_SET_CASUALLY = "100000"

[[env.staging.r2_buckets]]
binding = "STRUCTURES_BUCKET"
bucket_name = "geneguessr-structures-staging"
preview_bucket_name = "geneguessr-structures-staging"

[[env.staging.r2_buckets]]
binding = "ICONOPLASM_PORTRAITS"
bucket_name = "iconoplasm-portraits-staging"
preview_bucket_name = "iconoplasm-portraits-staging"

[env.staging.triggers]
crons = []
