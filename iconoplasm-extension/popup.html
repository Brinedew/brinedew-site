<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iconoplasm</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="popup-brand">
          <img class="popup-brand-mark" src="icons/icon-48.png" alt="" width="40" height="40" />
          <div class="popup-brand-copy">
            <p class="popup-kicker">Browser companion</p>
            <h1>Iconoplasm</h1>
          </div>
        </div>
        <div class="popup-version" id="version-text">v0.3.0</div>
      </header>

      <section class="popup-section" aria-labelledby="popup-appearance-title">
        <div class="popup-section-head">
          <p class="popup-section-kicker">Appearance</p>
          <h2 id="popup-appearance-title">On-page display</h2>
          <p class="popup-section-note">Choose how highlights and hover cards look while you browse.</p>
        </div>
        <div class="popup-field-list">
          <fieldset class="popup-field">
            <legend>Gene highlight</legend>
            <div class="popup-segmented" id="highlight-mode" role="radiogroup" aria-label="Gene highlight">
              <label class="popup-segment">
                <input type="radio" name="highlight-mode" value="underline" class="popup-radio" />
                <span class="popup-segment-label">Underline</span>
              </label>
              <label class="popup-segment">
                <input type="radio" name="highlight-mode" value="pill" class="popup-radio" />
                <span class="popup-segment-label">Color pills</span>
              </label>
              <label class="popup-segment">
                <input type="radio" name="highlight-mode" value="ellipse" class="popup-radio" />
                <span class="popup-segment-label">Rough ellipse</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="popup-field">
            <legend>Tooltip theme</legend>
            <div class="popup-segmented popup-segmented--compact" id="tooltip-theme" role="radiogroup" aria-label="Tooltip theme">
              <label class="popup-segment">
                <input type="radio" name="tooltip-theme" value="light" class="popup-radio" />
                <span class="popup-segment-label">Light</span>
              </label>
              <label class="popup-segment">
                <input type="radio" name="tooltip-theme" value="dark" class="popup-radio" />
                <span class="popup-segment-label">Dark</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="popup-field">
            <legend>Card style</legend>
            <div class="popup-segmented" id="card-variant" role="radiogroup" aria-label="Card style">
              <label class="popup-segment">
                <input type="radio" name="card-variant" value="simple" class="popup-radio" />
                <span class="popup-segment-label">Simple</span>
              </label>
              <label class="popup-segment">
                <input type="radio" name="card-variant" value="lit-archival" class="popup-radio" />
                <span class="popup-segment-label">Vintage lab label</span>
              </label>
              <label class="popup-segment">
                <input type="radio" name="card-variant" value="image-only" class="popup-radio" />
                <span class="popup-segment-label">Image only</span>
              </label>
            </div>
          </fieldset>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
