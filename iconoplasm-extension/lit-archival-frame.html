<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="generated/shared-card-vote.css" />
    <link rel="stylesheet" href="generated/shared-card-label.css" />
    <style>
      :root {
        --headerFont: "League Spartan", "Bahnschrift", "Arial Narrow", sans-serif;
        --codeFont: "IBM Plex Mono", monospace;
      }

      :root[data-theme="light"] {
        --light: oklch(96% 0.015 75);
        --lightgray: oklch(85% 0.02 65);
        --gray: oklch(70% 0.025 60);
        --darkgray: oklch(45% 0.03 55);
        --dark: oklch(20% 0.035 50);
        --accent: oklch(50% 0.08 185);
        --ui-border: oklch(82% 0.02 70);
        --ui-bg: oklch(92% 0.01 75);
        --secondary: oklch(40% 0.04 55);
      }

      :root[data-theme="dark"] {
        --light: oklch(16% 0.01 45);
        --lightgray: oklch(36% 0.02 50);
        --gray: oklch(58% 0.025 55);
        --darkgray: oklch(80% 0.02 60);
        --dark: oklch(85% 0.015 65);
        --accent: oklch(68% 0.08 185);
        --ui-border: oklch(38% 0.025 50);
        --ui-bg: oklch(30% 0.02 45);
        --secondary: oklch(70% 0.02 60);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        color: #1f120b;
      }

      #iconoplasm-root {
        /* Fence: the site card styles hang important tokens off #iconoplasm-root. Reusing that
           ID keeps the extension card on the same design contract, while these overrides strip
           away page-level padding/max-width that only make sense on the full website. */
        width: 100%;
        height: 100%;
        min-height: 298px;
        max-width: none;
        margin: 0;
        padding: 0;
        background: transparent;
        container-type: inline-size;
      }

      #lit-archival-card-slot {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 298px;
      }

      .icono-card--brick {
        width: 100%;
        min-height: 298px;
      }

      .icono-card--brick .iconoplasm-tooltip-portrait-media {
        cursor: pointer;
      }

      .icono-card--brick .icono-vote-box {
        pointer-events: auto;
      }

      .icono-card--variant-lab-label.icono-card--brick
        .icono-label-specimen-viewport
        .iconoplasm-tooltip-portrait-img {
        display: block;
      }

      @media (max-width: 720px) {
        .icono-card--variant-lab-label.icono-card--brick {
          inline-size: 100%;
          max-inline-size: 100%;
          display: grid;
          grid-template-columns: var(--icono-label-portrait-fr) var(--icono-label-form-fr);
          aspect-ratio: 1220 / 634;
          block-size: auto;
          min-block-size: 298px;
          padding: 0;
          overflow: hidden;
          transform: none;
          filter: none;
          clip-path: none;
        }

        .icono-card--variant-lab-label.icono-card--brick .iconoplasm-tooltip-portrait {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: calc(12 / 1220 * 100cqw);
          padding: calc(18 / 1220 * 100cqw) calc(18 / 1220 * 100cqw) calc(16 / 1220 * 100cqw);
          block-size: 100%;
          min-block-size: 0;
          aspect-ratio: auto;
          overflow: visible;
        }

        .icono-card--variant-lab-label.icono-card--brick .iconoplasm-tooltip-body {
          position: relative;
          inset: auto;
          display: block;
          block-size: 100%;
          min-block-size: 0;
          padding: 0;
          border: 0;
          border-left: 1px solid var(--icono-label-rule);
          background: var(--icono-label-paper);
          overflow: visible;
          filter: none;
          transform: none;
        }

        .icono-card--variant-lab-label.icono-card--brick .icono-label-specimen-viewport {
          display: block;
          flex: 1 0 calc(442 / 1220 * 100cqw);
          aspect-ratio: auto;
          min-block-size: 0;
          max-block-size: none;
          border: 1px solid color-mix(in srgb, var(--icono-label-rule-strong) 94%, transparent);
        }

        .icono-card--variant-lab-label.icono-card--brick .icono-label-specimen-footer {
          gap: calc(3 / 1220 * 100cqw);
          padding-top: 0;
          border-top: 1px solid var(--icono-label-rule);
        }
      }
    </style>
  </head>
  <body>
    <div id="iconoplasm-root"><div id="lit-archival-card-slot"></div></div>
    <script src="generated/rough.js"></script>
    <script src="generated/shared-card-runtime.js"></script>
    <script src="lit-archival-frame.js"></script>
  </body>
</html>
