<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="generated/shared-card-vote.css" />
    <link rel="stylesheet" href="generated/shared-card-label.css" />
    <style id="iconoplasm-site-brick-style"></style>
    <style>
      :root {
        --headerFont: "League Spartan", "Bahnschrift", "Arial Narrow", sans-serif;
        --codeFont: "IBM Plex Mono", monospace;
      }

      :root[data-theme="light"] {
        --light: oklch(96% 0.015 75);
        --lightgray: oklch(85% 0.02 65);
        --gray: oklch(70% 0.025 60);
        --darkgray: oklch(45% 0.03 55);
        --dark: oklch(20% 0.035 50);
        --accent: oklch(50% 0.08 185);
        --ui-border: oklch(82% 0.02 70);
        --ui-bg: oklch(92% 0.01 75);
        --secondary: oklch(40% 0.04 55);
      }

      :root[data-theme="dark"] {
        --light: oklch(16% 0.01 45);
        --lightgray: oklch(36% 0.02 50);
        --gray: oklch(58% 0.025 55);
        --darkgray: oklch(80% 0.02 60);
        --dark: oklch(85% 0.015 65);
        --accent: oklch(68% 0.08 185);
        --ui-border: oklch(38% 0.025 50);
        --ui-bg: oklch(30% 0.02 45);
        --secondary: oklch(70% 0.02 60);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        color: #1f120b;
      }

      #iconoplasm-root {
        /* Fence: the site card styles hang important tokens off #iconoplasm-root. Reusing that
           ID keeps the extension card on the same design contract, while these overrides strip
           away page-level padding/max-width that only make sense on the full website. */
        width: 100%;
        height: 100%;
        min-height: 298px;
        max-width: none;
        margin: 0;
        padding: 0;
        background: transparent;
        container-type: inline-size;
      }

      #lit-archival-card-slot {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 298px;
      }

      .icono-card--brick {
        width: 100%;
        min-height: 298px;
      }

      .icono-card--brick .iconoplasm-tooltip-portrait-media {
        cursor: pointer;
      }

      .icono-card--brick .icono-vote-box {
        pointer-events: auto;
      }

      .icono-card--variant-lab-label.icono-card--brick
        .icono-label-specimen-viewport
        .iconoplasm-tooltip-portrait-img {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="iconoplasm-root"><div id="lit-archival-card-slot"></div></div>
    <script src="generated/shared-card-runtime.js"></script>
    <script src="lit-archival-frame.js"></script>
  </body>
</html>
