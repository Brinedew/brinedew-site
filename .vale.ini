StylesPath = styles
MinAlertLevel = suggestion
Vocab = Brinedew

[content/wiki/*.md]
BasedOnStyles = Brinedew
# Ignore inline math, footnotes, and wikilinks
TokenIgnores = (\$[^$\n]+\$), (\[\^[^\]]+\]), (\[\[[^\]]+\]\])
# Ignore References sections and Obsidian image embeds
BlockIgnores = (?ms)^## References\b.*, (?m)^!\[\[.*\]\]$
