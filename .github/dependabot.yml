version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      npm-major:
        applies-to: "version-updates"
        update-types:
          - "major"
        patterns:
          - "*"
    ignore:
      # wrangler: major upgrades typically require wrangler.toml / compat-date
      # changes; do them deliberately.
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-major"]
      # wxt: the browser-extension bundler; majors re-shape wxt.config.ts.
      - dependency-name: "wxt"
        update-types: ["version-update:semver-major"]
      # @types/node: majors land on a new Node LTS; bump with the .node-version file.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      github-actions-major:
        applies-to: "version-updates"
        update-types:
          - "major"
        patterns:
          - "*"
