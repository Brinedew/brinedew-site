name: B742 regenerate cost identities once

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  regenerate-identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/b742-format-production-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regenerate operation cost identities
        run: node scripts/generate-operation-cost-identities.mjs
      - name: Verify generated identities
        run: node scripts/generate-operation-cost-identities.mjs --check
      - name: Commit generated identity only to the repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/generated/operation-cost-identities.js
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate operation cost identities"
          git push origin HEAD:fix/b742-format-production-runtime
