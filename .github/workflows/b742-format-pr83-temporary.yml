name: Temporary B-742 PR83 Formatter

on:
  push:
    branches: ["fix/b742-gene-pages-during-quarantine"]
    paths:
      - ".github/workflows/b742-format-pr83-temporary.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/b742-gene-pages-during-quarantine
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
          pnpm exec prettier \
            workers/b742-quarantine-gene-shell-inside-the-only-allowed-stateful-worker-do-not-duplicate.js \
            workers/b742-quarantine-gene-shell.test.js \
            --write
          git config user.name "Brinedew CI"
          git config user.email "brinedew@proton.me"
          git add \
            workers/b742-quarantine-gene-shell-inside-the-only-allowed-stateful-worker-do-not-duplicate.js \
            workers/b742-quarantine-gene-shell.test.js
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format B-742 quarantine gene shell"
          git push origin HEAD:fix/b742-gene-pages-during-quarantine
