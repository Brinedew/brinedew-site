name: B-762 cutover coherence audit
on:
  push:
    branches: ["audit/b762-cutover-coherence"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked isolated test runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Preserve pinned source and verify unchanged implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/audit-head.txt
          git diff --exit-code b3f2d027bd8eaa035a4955994cfdae58e91ea08c HEAD -- workers shared scripts/b762-v1-excision-audit.mjs scripts/b762-publication-path-audit.mjs
          git archive --format=tar.gz --output=audit-evidence/pinned-source.tar.gz b3f2d027bd8eaa035a4955994cfdae58e91ea08c workers shared scripts docs plans architecture-fences.json cloudflare package.json pnpm-lock.yaml pnpm-workspace.yaml AGENTS.md .github/workflows wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml
      - name: Repeat original eighteen audit checks
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/b762-v1-excision-audit.mjs scripts/b762-publication-path-audit.mjs 2>&1 | tee audit-evidence/original-audits.txt
      - name: Run cutover checks when present
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if test -f scripts/b762-cutover-coherence-audit.mjs; then
            node --test scripts/b762-cutover-coherence-audit.mjs 2>&1 | tee audit-evidence/cutover-audit.txt
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b762-cutover-coherence-evidence
          path: audit-evidence
          retention-days: 7
          if-no-files-found: error
