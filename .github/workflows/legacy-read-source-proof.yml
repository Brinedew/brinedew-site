name: Offline legacy read source proof
on:
  push:
    branches: [diagnostic/legacy-read-source-proof]
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Reproduce actual catalog handlers against local SQLite without provider access
        run: node scripts/probe-legacy-catalog-read.mjs
