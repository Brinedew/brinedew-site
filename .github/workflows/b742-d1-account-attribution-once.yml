name: B-742 live failure probe

on:
  push:
    branches:
      - diagnostic/b742-d1-account-attribution
    paths:
      - .github/workflows/b742-d1-account-attribution-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe live public surface and recent throttling without D1 mutation
        shell: bash
        run: |
          mkdir -p b742-live-probe
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'

          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim()
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim()
          if (!token || !accountId) throw new Error('Cloudflare telemetry credentials are unavailable')
          const now = new Date()
          const from = now.getTime() - 60 * 60 * 1000
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

          async function cfJson(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } })
            const text = await response.text()
            let payload
            try { payload = JSON.parse(text) } catch { throw new Error(`Cloudflare returned non-JSON HTTP ${response.status}`) }
            if (!response.ok || payload?.success === false) throw new Error(`Cloudflare request failed HTTP ${response.status}: ${JSON.stringify(payload?.errors || payload)}`)
            return payload
          }

          async function publicProbe(path) {
            const url = `https://iconoplasm.brinedew.bio${path}`
            const started = Date.now()
            try {
              const response = await fetch(url, { headers: { 'User-Agent': 'B742-live-read-only-probe/1.0' }, redirect: 'manual' })
              const body = await response.text()
              return {
                path,
                status: response.status,
                contentType: response.headers.get('content-type'),
                cache: response.headers.get('cf-cache-status'),
                retryAfter: response.headers.get('retry-after'),
                location: response.headers.get('location'),
                bytes: Buffer.byteLength(body),
                bodyPrefix: body.slice(0, 240),
                durationMs: Date.now() - started,
              }
            } catch (error) {
              return { path, error: String(error?.message || error), durationMs: Date.now() - started }
            }
          }

          const smoke = []
          for (const path of [
            '/',
            '/genes/TP53',
            '/api/public/v1/metadata',
            '/api/public/v1/catalog/manifest',
            '/api/public/v1/genes/TP53',
          ]) smoke.push(await publicProbe(path))

          const telemetry = await cfJson(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/observability/telemetry/query`, {
            method: 'POST',
            body: JSON.stringify({
              queryId: 'b742-recent-workstation-errors',
              timeframe: { from, to: now.getTime() },
              view: 'calculations',
              dry: true,
              limit: 2000,
              parameters: {
                datasets: ['cloudflare-workers'],
                filterCombination: 'and',
                filters: [
                  { key: '$metadata.service', operation: 'eq', type: 'string', value: 'geneguessr-api' },
                  { key: 'route', operation: 'exists', type: 'string' },
                ],
                calculations: [{ operator: 'count', alias: 'event_count' }],
                groupBys: [
                  { type: 'string', value: 'route' },
                  { type: 'string', value: 'source_class' },
                  { type: 'number', value: 'status' },
                  { type: 'string', value: 'error_code' },
                  { type: 'string', value: 'limiter_stage' },
                  { type: 'string', value: 'method' },
                ],
                limit: 2000,
                orderBy: { value: 'event_count', order: 'desc' },
              },
            }),
          })

          const rows = []
          for (const calc of Array.isArray(telemetry?.result?.calculations) ? telemetry.result.calculations : []) {
            for (const aggregate of Array.isArray(calc?.aggregates) ? calc.aggregates : []) {
              const groups = Object.fromEntries((aggregate.groups || []).map((group) => [String(group.key), group.value]))
              rows.push({ groups, eventCount: Number(aggregate.value ?? aggregate.count ?? 0) })
            }
          }
          rows.sort((a, b) => b.eventCount - a.eventCount)

          const day = now.toISOString().slice(0, 10)
          const d1Query = `query B742Now($accountTag: string, $day: Date) { viewer { accounts(filter: { accountTag: $accountTag }) { d1AnalyticsAdaptiveGroups(limit: 1000, filter: { date_geq: $day, date_leq: $day }) { dimensions { databaseId } sum { rowsRead rowsWritten readQueries writeQueries } } } } }`
          const d1Payload = await cfJson('https://api.cloudflare.com/client/v4/graphql', {
            method: 'POST',
            body: JSON.stringify({ query: d1Query, variables: { accountTag: accountId, day } }),
          })
          const d1 = d1Payload?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups || []

          const report = { generatedAt: now.toISOString(), smoke, recentRoutes: rows, d1 }
          await writeFile('b742-live-probe/report.json', JSON.stringify(report, null, 2))
          console.log(JSON.stringify(report, null, 2))
          NODE

      - name: Upload probe report
        uses: actions/upload-artifact@v7
        with:
          name: b742-live-probe
          path: b742-live-probe/report.json
          if-no-files-found: error
          retention-days: 1
