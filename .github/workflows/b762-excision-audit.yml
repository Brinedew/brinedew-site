name: B-762 legacy excision audit
on:
  push:
    branches: ["audit/b762-legacy-excision"]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked isolated runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Record pinned source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/audit-head.txt
          git diff --stat 09f499d3a3103bd793069cd7360b26ba0a7afcd6 48408d8ac82de7cc7504749e9e6396af1350d5c3 > audit-evidence/implementation-diff-stat.txt
          git diff --exit-code 48408d8ac82de7cc7504749e9e6396af1350d5c3 HEAD -- workers shared
      - name: Excision regressions (failures expected against uncorrected branch)
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/b762-v1-excision-audit.mjs 2>&1 | tee audit-evidence/regressions.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b762-excision-regressions
          path: audit-evidence
          retention-days: 7
          if-no-files-found: error
