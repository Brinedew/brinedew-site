name: Refresh Iconoplasm observability snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: iconoplasm-observability-snapshot
  cancel-in-progress: true

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js (22.x) with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify Node/npm and bump npm to >=10.9.2
        run: |
          node -v
          npm -v
          npm i -g npm@10.9.2
          npm -v

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bake Iconoplasm observability snapshot (production)
        run: node scripts/generate-iconoplasm-observability-snapshot.mjs --env production

      - name: Run focused Iconoplasm admin tests
        run: node --test workers/iconoplasm.admin-html.test.js workers/admin-html.iconoplasm-costs.test.js

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4

      - name: Deploy the only allowed internal stateful worker (production)
        run: wrangler deploy --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml
