name: Observe Cloudflare capacity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconoplasm-observability-snapshot
  cancel-in-progress: true

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (22.x)
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify Node/pnpm and dependency release delay
        run: |
          node -v
          pnpm -v
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Bake Iconoplasm observability snapshot (production)
        id: snapshot
        run: node scripts/generate-iconoplasm-observability-snapshot.mjs --env production

      # One hourly KV write is the publication boundary. It is atomic, does not
      # redeploy application code, and keeps Cloudflare GraphQL out of the live
      # request path. Stop before publishing when the shared free-plan KV budget
      # is already under pressure.
      - name: Check account capacity and snapshot publication headroom
        id: budget
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/check-iconoplasm-cloudflare-budget-headroom.mjs

      - name: Publish observability snapshot atomically
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && steps.budget.outputs.snapshot_publication_allowed == 'true' }}
        run: >-
          pnpm exec wrangler kv key put
          "iconoplasm:observability-snapshot:v1"
          --binding KV
          --path workers/generated/iconoplasm-observability-snapshot.json
          --remote
          --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml

      - name: Check single-statement D1 burns
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/check-iconoplasm-d1-statement-burns.mjs
