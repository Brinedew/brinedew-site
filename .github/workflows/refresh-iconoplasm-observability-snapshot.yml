name: Refresh Iconoplasm observability snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconoplasm-observability-snapshot
  cancel-in-progress: true

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify Node/pnpm and dependency release delay
        run: |
          node -v
          pnpm -v
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake Iconoplasm observability snapshot (production)
        run: node scripts/generate-iconoplasm-observability-snapshot.mjs --env production

      - name: Run focused Iconoplasm admin tests
        run: node --test workers/iconoplasm.admin-html.test.js workers/admin-html.iconoplasm-costs.test.js

      - name: Deploy the only allowed internal stateful worker (production)
        run: pnpm exec wrangler deploy --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml
