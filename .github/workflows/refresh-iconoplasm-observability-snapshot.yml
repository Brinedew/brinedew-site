name: Refresh Iconoplasm observability snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconoplasm-observability-snapshot
  cancel-in-progress: true

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Bump actions/checkout @v6 -> @v7 (2026 current major). setup-node
      # @v6 is already the latest.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify Node/pnpm and dependency release delay
        run: |
          node -v
          pnpm -v
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake Iconoplasm observability snapshot (production)
        run: node scripts/generate-iconoplasm-observability-snapshot.mjs --env production

      - name: Run focused Iconoplasm admin tests
        run: node --test workers/iconoplasm.admin-html.test.js workers/admin-html.iconoplasm-costs.test.js

      # The previous version of this workflow also ran
      #   pnpm exec wrangler deploy --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml
      # at the end, which re-deployed the stateful Worker every time someone
      # refreshed the observability snapshot. That made this workflow a
      # second, concurrency-unrelated deploy path for the same Worker as
      # deploy-quartz.yml (concurrency group: production-deploy). The two
      # could race and the snapshot refresh would silently bypass the
      # D1-cost-barrier + card-catalog budget preflight checks in
      # deploy-quartz.yml ("Verify Iconoplasm Worker budget guards").
      #
      # The canonical stateful-Worker deploy path is
      #   .github/workflows/deploy-quartz.yml -> "Deploy the only allowed
      #   internal stateful worker (production)".
      # Refresh-snapshot does NOT deploy. If the snapshot bakes a new
      # internal-Worker config artifact, the next push to main is what
      # rolls it out.
