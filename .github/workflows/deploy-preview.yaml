name: Upload Preview Deployment
on:
  workflow_run:
    workflows: ["Build Preview Deployment"]
    types:
      - completed

permissions:
  actions: read
  deployments: write
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    # This workflow is optional. If CLOUDFLARE_ACCOUNT_ID is not configured,
    # skip the preview deploy instead of failing the entire Actions run history.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Deploy Preview to Cloudflare Pages
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
    steps:
      - name: Check Cloudflare preview config
        id: cf-config
        run: |
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice title=Preview deploy skipped::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN repo secrets to enable Cloudflare Pages preview deployments."
          echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        if: ${{ steps.cf-config.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v7
        id: preview-build-artifact
        with:
          name: preview-build
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.cf-config.outputs.enabled == 'true' }}
        uses: AdrianGonz97/refined-cf-pages-action@v1
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: brinedew-bio
          deploymentName: Branch Preview
          directory: ${{ steps.preview-build-artifact.outputs.download-path }}
