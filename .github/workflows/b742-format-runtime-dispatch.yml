name: B742 format runtime branch once

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/b742-format-production-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Format the production runtime
        run: pnpm exec prettier workers/iconoplasm-stateful-runtime-inside-the-only-allowed-internal-worker-do-not-duplicate.js --write
      - name: Commit formatting only to the repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/iconoplasm-stateful-runtime-inside-the-only-allowed-internal-worker-do-not-duplicate.js
          git diff --cached --quiet && exit 0
          git commit -m "Format Iconoplasm stateful runtime"
          git push origin HEAD:fix/b742-format-production-runtime
