name: Assemble recovery ownership documentation
on:
  push:
    branches: [docs/recovery-ownership-fence]
    paths: [.github/workflows/recovery-ownership-docs-assembly.yml]
permissions:
  contents: write
jobs:
  assemble-documentation:
    if: github.ref == 'refs/heads/docs/recovery-ownership-fence'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Verify documentation pointers and normalize only added spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          paths = [
              'AGENTS.md',
              'docs/ARCHITECTURE_FENCES.md',
              'docs/D1_READ_EXHAUSTION_PREVENTION.md',
              'docs/RECOVERY_RESUME_CHECKLIST.md',
              'docs/B742_RECOVERY_HANDOFF.md',
          ]
          for name in paths:
              path = Path(name)
              original = path.read_text(encoding='utf-8')
              assert original.count('## Recovery ownership fence: RECOVERY-001') == 1, name
              target = ('docs/RECOVERY_OWNERSHIP_CONTRACT.md'
                        if name == 'AGENTS.md' else 'RECOVERY_OWNERSHIP_CONTRACT.md')
              assert (path.parent / target).is_file(), name
              updated = original.replace(
                  'Historical checkpoints below require fresh state reconciliation.\n\n\n',
                  'Historical checkpoints below require fresh state reconciliation.\n\n', 1)
              path.write_text(updated, encoding='utf-8', newline='\n')
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert not (set(changed) - set(paths))
          print('Five instruction entrypoints verified; original document bodies preserved.')
          PY
          git diff --check
      - name: Publish only documentation edits to this review branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/docs/recovery-ownership-fence"
          git config user.name 'Brinedew recovery documentation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/ARCHITECTURE_FENCES.md docs/D1_READ_EXHAUSTION_PREVENTION.md docs/RECOVERY_RESUME_CHECKLIST.md docs/B742_RECOVERY_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m 'Verify RECOVERY-001 links and normalize added heading spacing'
            git push origin HEAD:refs/heads/docs/recovery-ownership-fence
          fi
          git rev-parse HEAD
