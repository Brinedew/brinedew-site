name: Rotate Iconoplasm admin token

on:
  workflow_dispatch:
    inputs:
      operator_confirmation:
        description: "Type exactly: ROTATE ICONOPLASM ADMIN TOKEN"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rotate-token:
    name: Provision Worker admin-token secret
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
      OPERATOR_CONFIRMATION: ${{ inputs.operator_confirmation }}
    steps:
      - name: Confirm deliberate token rotation
        run: |
          if [ "${OPERATOR_CONFIRMATION}" != "ROTATE ICONOPLASM ADMIN TOKEN" ]; then
            echo "This workflow rotates the live Iconoplasm admin token. Re-run it only with the exact confirmation phrase." >&2
            exit 1
          fi
          if [ -z "${ICONOPLASM_ADMIN_TOKEN:-}" ]; then
            echo "Missing GitHub secret ICONOPLASM_ADMIN_TOKEN." >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      # Bump actions/checkout @v4 -> @v7 and actions/setup-node @v4 -> @v6
      # (2026 current majors). The setup-node bump also lets us drop
      # `cache: "npm"` and install with pnpm below, matching package.json.
      - name: Checkout repository
        uses: actions/checkout@v7

      # This workflow rotates the live ICONOPLASM_ADMIN_TOKEN in two Workers.
      # Use pnpm to match package.json#packageManager ("pnpm@11.0.9") and
      # .npmrc#engine-strict. The previous `npm ci` + `cache: "npm"` shape
      # worked only because nothing here depended on the JS toolchain; the
      # moment someone adds a JS preflight it would silently install with
      # the wrong lockfile.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rotate stateful Worker secret
        run: |
          printf '%s' "${ICONOPLASM_ADMIN_TOKEN}" \
            | pnpm exec wrangler secret put ICONOPLASM_ADMIN_TOKEN \
                --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml

      - name: Rotate public edge Worker secret
        run: |
          printf '%s' "${ICONOPLASM_ADMIN_TOKEN}" \
            | pnpm exec wrangler secret put ICONOPLASM_ADMIN_TOKEN \
                --config wrangler.the-only-allowed-public-edge-worker-upload-only.toml
