name: Deploy Staging (Pages + Worker)

on:
  workflow_dispatch:
  push:
    branches: ["staging"]

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy-staging-pages:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install pandas pyyaml python-frontmatter requests

      - name: Enrich protein pages
        run: python scripts/enrich-proteins.py

      - name: Setup Node.js (22.x) with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify Node/npm and bump npm to >=10.9.2
        run: |
          node -v
          npm -v
          npm i -g npm@10.9.2
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: npm run build

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4

      - name: Deploy staging build to Cloudflare Pages
        run: wrangler pages deploy public --project-name brinedew-bio-staging --branch staging

  deploy-staging-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4

      - name: Apply Iconoplasm D1 migrations (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply iconoplasm-staging --remote --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --env staging

      - name: Deploy the only allowed internal stateful worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --env staging

      - name: Deploy public edge worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env staging

      - name: Smoke test Discord OAuth bootstrap (staging)
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          curl -sS -D "$headers_file" -o /dev/null "https://staging.brinedew.bio/api/auth/login?leaderboard_opt_in=0"

          status="$(awk 'NR==1 { print $2 }' "$headers_file")"
          location="$(grep -i '^Location:' "$headers_file" | head -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"

          echo "OAuth login status: $status"
          echo "OAuth redirect location: $location"

          if [ "$status" != "302" ]; then
            echo "Expected 302 from staging /api/auth/login but got $status" >&2
            exit 1
          fi

          if [[ "$location" != https://discord.com/oauth2/authorize* ]]; then
            echo "Expected Discord OAuth redirect URL, got: $location" >&2
            exit 1
          fi

          if echo "$location" | grep -Eq 'client_id=(|undefined|null)($|&)'; then
            echo "Discord OAuth redirect has invalid client_id in staging." >&2
            exit 1
          fi
