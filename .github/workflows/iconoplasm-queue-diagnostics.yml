name: Iconoplasm Queue Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-diagnostics:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ICONOPLASM_FINALIZATION_QUEUE_ID: 8c42f0529920466c993815aa537e4728
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4

      - name: Validate Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing Cloudflare credentials." >&2
            exit 1
          fi

      - name: Resume finalization queue delivery
        run: |
          set -euo pipefail
          wrangler queues resume-delivery iconoplasm-sync-finalization || true

      - name: Inspect finalization queue
        run: |
          set -euo pipefail
          wrangler queues info iconoplasm-sync-finalization
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ICONOPLASM_FINALIZATION_QUEUE_ID}/consumers" \
            | python -m json.tool
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ICONOPLASM_FINALIZATION_QUEUE_ID}/metrics" \
            | python -m json.tool
