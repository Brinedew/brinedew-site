name: Iconoplasm Queue Diagnostics

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do with the finalization queue"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - kick
          - full

permissions:
  contents: read

jobs:
  queue-diagnostics:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ICONOPLASM_FINALIZATION_QUEUE_ID: 8c42f0529920466c993815aa537e4728
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4

      - name: Validate Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing Cloudflare credentials." >&2
            exit 1
          fi
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | python -m json.tool

      - name: Inspect Cloudflare account auth surface
        run: |
          set -euo pipefail
          for path in \
            "accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" \
            "accounts/${CLOUDFLARE_ACCOUNT_ID}/billing/profile" \
            "accounts/${CLOUDFLARE_ACCOUNT_ID}/subscriptions" \
            "accounts/${CLOUDFLARE_ACCOUNT_ID}/billing/usage/paygo"
          do
            echo "::group::GET /${path}"
            curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/${path}" \
              | python -m json.tool
            echo "::endgroup::"
          done

      - name: Resume finalization queue delivery
        if: ${{ inputs.action == 'kick' || inputs.action == 'full' }}
        run: |
          set -euo pipefail
          wrangler queues resume-delivery iconoplasm-sync-finalization || true

      - name: Inspect finalization queue
        run: |
          set -euo pipefail
          wrangler queues info iconoplasm-sync-finalization
          wrangler queues info iconoplasm-sync-dlq || true
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ICONOPLASM_FINALIZATION_QUEUE_ID}/consumers" \
            | python -m json.tool
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ICONOPLASM_FINALIZATION_QUEUE_ID}/metrics" \
            | python -m json.tool

      - name: Push one canonical drain message and capture worker tail
        if: ${{ inputs.action == 'kick' || inputs.action == 'full' }}
        run: |
          set -euo pipefail
          timeout 75s wrangler tail geneguessr-api --format pretty > /tmp/iconoplasm-worker-tail.log 2>&1 &
          tail_pid=$!
          sleep 8
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ICONOPLASM_FINALIZATION_QUEUE_ID}/messages" \
            --data '{"content_type":"json","body":{"kind":"drain_finalization_ledger","run_id":"github-actions-queue-diagnostic","symbols":[]}}' \
            | python -m json.tool
          sleep 45
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          cat /tmp/iconoplasm-worker-tail.log

      - name: Inspect queue after diagnostic message
        if: ${{ inputs.action == 'kick' || inputs.action == 'full' }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ICONOPLASM_FINALIZATION_QUEUE_ID}/metrics" \
            | python -m json.tool

      - name: Inspect durable finalization ledger
        if: ${{ inputs.action == 'full' }}
        run: |
          set -euo pipefail
          wrangler d1 execute iconoplasm --remote --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --command "
            SELECT gene_symbol, status, phase, attempts, requested_at, last_attempt_at, next_attempt_at, last_error
            FROM icono_sync_finalization_jobs
            WHERE status IN ('running', 'retrying')
            ORDER BY status, COALESCE(NULLIF(last_attempt_at, ''), requested_at), gene_symbol
            LIMIT 25;
          "
