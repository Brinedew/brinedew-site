name: Deploy Benchmark Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Bump actions/checkout @v6 -> @v7 (2026 current major). The benchmark
      # service binds to the production runtime, whose deploy now includes the
      # generated Iconoplasm static asset bundle, so this workflow uses the same
      # pnpm/build path as the canonical production workflow.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Build site and Iconoplasm static asset bundle
        run: pnpm run build

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
        run: |
          echo "Applying D1 migrations..."
          set +e
          OUTPUT=$(pnpm exec wrangler d1 migrations apply geneguessr --remote --config workers/benchmark/the-only-allowed-benchmark-migrations-do-not-deploy.toml 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "duplicate column name: state"; then
              echo "Migration already applied on remote DB; continuing."
            else
              echo "Migration apply failed with unexpected error."
              exit "$STATUS"
            fi
          fi

      - name: Deploy the only allowed internal stateful worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
        run: |
          echo "Deploying the only allowed internal stateful worker..."
          pnpm exec wrangler deploy --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml

      - name: Upload public benchmark edge worker script without routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
        run: |
          echo "Uploading public benchmark edge worker script..."
          pnpm exec wrangler deploy --config workers/benchmark/the-only-allowed-public-benchmark-edge-worker-upload-only.toml

      - name: Reassign benchmark route to the public benchmark edge worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
        run: |
          node scripts/reassign-cloudflare-worker-routes.mjs \
            brinedew.bio \
            the-only-allowed-public-benchmark-edge-worker-that-must-not-touch-state \
            "geneguessr-bench.brinedew.bio/*"

      - name: Smoke test health endpoint
        run: |
          set -euo pipefail
          echo "Waiting 10s for Worker to propagate..."
          sleep 10

          RESP=$(curl -sf "https://geneguessr-bench.brinedew.bio/health" || echo '{"ok":false}')
          echo "Health response: $RESP"

          OK=$(echo "$RESP" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "Health check failed"
            exit 1
          fi

          echo "Benchmark Worker is healthy"
