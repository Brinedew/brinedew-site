name: Iconoplasm Cloudflare Budget Watch

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconoplasm-cloudflare-budget-watch
  cancel-in-progress: true

jobs:
  budget-watch:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ICONOPLASM_KV_BUDGET_ALERT_RATIO: "0.8"
      ICONOPLASM_KV_DELETE_BUDGET_ALERT_RATIO: "0.95"
    steps:
      # Bump actions/checkout @v6 -> @v7 (2026 current major). This
      # schedule-driven KV headroom check fires every 2 hours; bumping the
      # checkout pin keeps it aligned with the rest of the workflow set.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify Node/pnpm and dependency release delay
        run: |
          node -v
          pnpm -v
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Check Cloudflare KV budget headroom
        run: node scripts/check-iconoplasm-cloudflare-budget-headroom.mjs
