name: B-762 publication path audit
on:
  push:
    branches: ["audit/b762-publication-path"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked test runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Verify the implementation stayed unchanged
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/audit-head.txt
          git diff --exit-code ee4b3b573a6aefb6f0be0371bbfc08d75baeb7c9 HEAD -- workers shared scripts/b762-v1-excision-audit.mjs
      - name: Previous eleven regression checks
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/b762-v1-excision-audit.mjs 2>&1 | tee audit-evidence/prior-regressions.txt
      - name: Publication and transfer boundaries
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/b762-publication-path-audit.mjs 2>&1 | tee audit-evidence/publication-regressions.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b762-publication-regressions
          path: audit-evidence
          retention-days: 7
          if-no-files-found: error
