name: B-762 reader completion
on:
  push:
    branches: ["work/b762-reader-completion"]
permissions:
  contents: write
concurrency:
  group: b762-reader-source
  cancel-in-progress: false
jobs:
  reader-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the reviewed source patch when present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reader-evidence
          git rev-parse HEAD > reader-evidence/input-head.txt
          if [ -f scripts/reader-completion-patch.1.b64 ]; then
            cat scripts/reader-completion-patch.1.b64 scripts/reader-completion-patch.2.b64 | base64 -d | xz -d > /tmp/b762-reader.patch
            echo '83552c4bd04c90cf73482f44e50678949c6f1af6f9721f45a5782059be683a8a  /tmp/b762-reader.patch' | sha256sum --check
            git apply --check /tmp/b762-reader.patch
            git apply /tmp/b762-reader.patch
            cp /tmp/b762-reader.patch reader-evidence/source.patch
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked test runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Initialize repository plugin dependencies
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only
      - name: Format changed source and bind executable identity
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            workers/lib/iconoplasm-card-delta-tree.js \
            workers/lib/iconoplasm-card-reader-view.js \
            workers/lib/iconoplasm-card-reader-view.test.js \
            workers/lib/iconoplasm-card-gene-delta.js \
            workers/lib/iconoplasm-card-gene-delta.test.js \
            workers/lib/iconoplasm-card-publication-coordinator.js \
            workers/iconoplasm.reader-view-routing.test.js \
            workers/iconoplasm-card-publication-runtime.test.js \
            workers/iconoplasm-hover-delivery-runtime-inside-the-only-allowed-internal-stateful-worker-do-not-duplicate.js \
            workers/iconoplasm-stateful-runtime-inside-the-only-allowed-internal-worker-do-not-duplicate.js \
            AGENTS.md architecture-fences.json docs/ARCHITECTURE_FENCES.md \
            docs/ICONOPLASM_CARD_PUBLICATION_V2.md \
            docs/ICONOPLASM_CAPACITY_AND_BACKGROUND_WORK_RUNBOOK.md \
            plans/B-762-DELETION-INVENTORY.md
          node scripts/generate-operation-cost-identities.mjs
          git diff --stat > reader-evidence/changes.txt
      - name: Retained audit checks
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/b762-v1-excision-audit.mjs scripts/b762-publication-path-audit.mjs scripts/b762-cutover-coherence-audit.mjs 2>&1 | tee reader-evidence/audits.txt
      - name: Actual reader routes, immutable history and bounded owner behavior
        shell: bash
        run: |
          set -o pipefail
          node --test \
            workers/lib/iconoplasm-card-gene-delta.test.js \
            workers/lib/iconoplasm-card-reader-view.test.js \
            workers/iconoplasm.reader-view-routing.test.js \
            workers/iconoplasm.vote-authority-handoff.test.js \
            workers/iconoplasm-card-publication-runtime.test.js \
            workers/lib/iconoplasm-card-publication-materialize-symbol.test.js \
            2>&1 | tee reader-evidence/readers.txt
      - name: Architecture, types and full repository tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run validate:iconoplasm-topology 2>&1 | tee reader-evidence/topology.txt
          pnpm exec tsc --noEmit 2>&1 | tee reader-evidence/types.txt
          pnpm test 2>&1 | tee reader-evidence/full-tests.txt
      - name: Commit verified application files to this branch only
        env:
          SOURCE_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/b762-reader-completion
          REMOTE=$(git ls-remote origin refs/heads/work/b762-reader-completion | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git add workers AGENTS.md architecture-fences.json docs/ARCHITECTURE_FENCES.md docs/ICONOPLASM_CARD_PUBLICATION_V2.md docs/ICONOPLASM_CAPACITY_AND_BACKGROUND_WORK_RUNBOOK.md plans/B-762-DELETION-INVENTORY.md
          if [ -f scripts/reader-completion-patch.1.b64 ]; then
            git rm scripts/reader-completion-patch.1.b64 scripts/reader-completion-patch.2.b64
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'B-762: connect immutable reader views through current, detail and portrait delivery'
            AUTH=$(printf 'x-access-token:%s' "$SOURCE_WRITE_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/work/b762-reader-completion
          fi
          git rev-parse HEAD > reader-evidence/verified-head.txt
          git rev-parse HEAD:workers > reader-evidence/verified-workers-tree.txt
          git diff 06188b5fff8b2e749235a540328a65c03da2bb4a HEAD -- workers docs plans AGENTS.md architecture-fences.json > reader-evidence/verified-source.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b762-reader-evidence
          path: reader-evidence
          retention-days: 7
          if-no-files-found: error
