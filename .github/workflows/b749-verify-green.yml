name: B-749 verify scoped finalization cutover

on:
  push:
    branches:
      - fix/b749-reject-global-read-model-sync

permissions:
  contents: read

jobs:
  verify:
    if: ${{ contains(github.event.head_commit.message, '[b749-verify-green]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only
      - name: Apply candidate cutover patch in the isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          cat .github/b749-patch-v3-1.b64 .github/b749-patch-v3-2.b64 | base64 --decode | gzip -d > /tmp/b749-source.patch
          git apply --check /tmp/b749-source.patch
          git apply /tmp/b749-source.patch
          cat .github/b749-test-v2-1.b64 .github/b749-test-v2-2.b64 | base64 --decode | gzip -d > workers/iconoplasm/sync-finalization-publication.test.js
      - name: Update retained tests to require an exact reset scope
        shell: python
        run: |
          from pathlib import Path

          p = Path('workers/iconoplasm.finalization-reset-alarm.test.js')
          s = p.read_text()
          old = 'else await this.governor.deferFinalizationToReset();'
          new = "else await this.governor.deferFinalizationToReset({runId:'retained-alarm-run',symbols:['TP53']});"
          if old not in s: raise SystemExit('reset alarm anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('workers/iconoplasm.vote-reset-wake.test.js')
          s = p.read_text()
          old = 'await governor.deferFinalizationToReset()'
          new = 'await governor.deferFinalizationToReset({ runId: "shared-reset-run", symbols: ["TP53"] })'
          if old not in s: raise SystemExit('shared wake anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('workers/iconoplasm.daily-budget-kill-switch.test.js')
          s = p.read_text()
          old = 'body: { kind: "drain_finalization_ledger", run_id: "sync-budget-test", symbols: [] },'
          new = 'body: { kind: "drain_finalization_ledger", run_id: "sync-budget-test", symbols: ["TP53"] },'
          if old not in s: raise SystemExit('daily budget anchor missing')
          p.write_text(s.replace(old, new, 1))
      - name: Regenerate checked-in implementation identity
        run: |
          node scripts/generate-operation-cost-identities.mjs
          node scripts/generate-operation-cost-identities.mjs --check
      - name: Format touched files
        run: |
          pnpm exec prettier --write workers/iconoplasm-stateful-runtime-inside-the-only-allowed-internal-worker-do-not-duplicate.js workers/iconoplasm/sync-finalization-publication.js workers/iconoplasm/sync-finalization-publication.test.js workers/iconoplasm.sync-finalization-queue.test.js workers/iconoplasm.b749-scoped-reset.test.js workers/iconoplasm.finalization-reset-alarm.test.js workers/iconoplasm.vote-reset-wake.test.js workers/iconoplasm.daily-budget-kill-switch.test.js
      - name: Focused regression suite
        run: |
          pnpm exec node --test workers/iconoplasm/sync-finalization-publication.test.js workers/iconoplasm.sync-finalization-queue.test.js workers/iconoplasm.b749-scoped-reset.test.js workers/iconoplasm.finalization-reset-alarm.test.js workers/iconoplasm.vote-reset-wake.test.js
      - name: Type and style checks
        run: pnpm run check
      - name: Full repository suite
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Topology validation
        run: pnpm run validate:iconoplasm-topology
      - name: Wrangler dry run
        run: pnpm exec wrangler deploy --dry-run --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml
      - name: Archive exact verified working tree changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT > /tmp/b749-files.txt
          tar -czf /tmp/b749-verified-files.tar.gz -T /tmp/b749-files.txt
          cp /tmp/b749-files.txt /tmp/b749-verified-files.txt
      - uses: actions/upload-artifact@v7
        with:
          name: b749-verified-scoped-finalization-${{ github.sha }}
          path: |
            /tmp/b749-verified-files.tar.gz
            /tmp/b749-verified-files.txt
          retention-days: 3
