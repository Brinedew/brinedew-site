name: Deploy Production (Cloudflare Pages + Worker)

on:
  push:
    branches: ["main"]
    # Agent runbooks and plans are outside Quartz's `content` build input. Do
    # not redeploy Workers and Pages for an operations-note-only change.
    paths-ignore:
      - "docs/**"
      - "plans/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  # Finish Worker + Pages activation together. A delayed old push must not
  # cancel a newer release halfway through its schema/publication transition.
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # B-857: actions: write lets a superseded push cancel its own run (grey)
    # instead of failing red at the head check. Nothing else here uses it.
    permissions:
      contents: read
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CACHE_BUST: ${{ github.sha }}
      ICONOPLASM_COST_OVERRUN_LOG: ${{ github.workspace }}/../iconoplasm-cost-overruns.jsonl
    steps:
      # This workflow is the canonical production deploy path; anything that
      # touches it should also update the "Canonical production deploy path"
      # comment in scripts/deploy-cloudflare-prod.ps1.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Reject stale production source before admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-production-head.mjs

      - name: Protect previously published extension downloads
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/verify-iconoplasm-release-history.mjs

      # Exact-head ci.yaml already builds and runs the full test suite, including
      # the Worker budget and architecture checks. This gate prevents deployment
      # until that same commit passes; do not rerun a partial test list here.
      # ARCHITECTURE FENCE [IPD-001]: keep healthy Bunny portrait delivery.
      # ARCHITECTURE FENCE [IPD-005]: keep bounded D1 state and retention.
      # ARCHITECTURE FENCE [IPD-008]: keep anonymous reading off mutable state.
      - name: Require successful tests for the exact deployed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-iconoplasm-release-ci.mjs

      - name: Verify the code release against the installed revision
        run: node scripts/verify-code-release.mjs

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify Node/pnpm and dependency release delay
        run: |
          node -v
          pnpm -v
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate Cloudflare secrets
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${ICONOPLASM_ADMIN_TOKEN:-}" ]; then
            echo "Missing Cloudflare deployment credentials or the cost-operation admin secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Sync shared Iconoplasm assets before release guards
        run: pnpm run sync:iconoplasm-shared

      - name: Bake Iconoplasm observability snapshot (production)
        run: node scripts/generate-iconoplasm-observability-snapshot.mjs --env production

      - name: Build Quartz site
        run: pnpm run build

      - name: Prove exact built static route ownership
        run: node --test workers/iconoplasm-static-assets.workerd.test.js

      - name: Verify Geneguessr assets bundled
        run: |
          ls -lah public/static/geneguessr
          grep -n "bootstrapGame" public/static/geneguessr/app.js

      # Canonical production domain is brinedew.bio. The Linear project
      # "Brinedew.bio website" lists "brinedew.com as canonical domain" as
      # an obsolete assumption. The fallback here MUST match quartz.config.yaml
      # baseUrl (line 79) and the cname plugin (line 220), otherwise a missing
      # content/CNAME will silently re-point production at the dead domain.
      - name: Ensure CNAME file exists
        run: |
          mkdir -p public
          if [ -f "content/CNAME" ]; then
            cp content/CNAME public/CNAME
          elif [ -f "CNAME" ]; then
            cp CNAME public/CNAME
          else
            echo "brinedew.bio" > public/CNAME
          fi

      - name: Disable Jekyll processing
        run: |
          mkdir -p public
          touch public/.nojekyll

      # Pages validates the wrangler.toml in its current working directory and rejects
      # Worker-only keys like `main`, `routes`, and `triggers`. Keep the production
      # Worker config at repo root, but copy a tiny Pages-only config into an isolated
      # temp directory so this workflow remains the single canonical deploy path.
      - name: Prepare isolated Pages Wrangler config
        run: |
          mkdir -p .wrangler-pages
          cp wrangler.pages.toml .wrangler-pages/wrangler.toml

      - name: Validate Iconoplasm deployment topology
        run: pnpm run validate:iconoplasm-topology

      # ARCHITECTURE FENCE [IPD-009]: validate the machine-readable topology
      # before uploading any Worker or reconciling a route. A CSS-only release
      # still has to deploy a cold-safe version of the one state owner.
      # ARCHITECTURE FENCE [IPD-003]: training ingestion is not the search
      # discovery contract. This WAF rule executes before the Worker and keeps
      # GPTBot/ClaudeBot from spending the daily request allowance while
      # OAI/Claude/Perplexity search and user-directed agents stay reachable.
      - name: Reconcile Iconoplasm training-crawler budget guard
        run: node scripts/reconcile-iconoplasm-crawler-policy.mjs brinedew.bio

      # B-847: reviewed online migrations (plan entries marked "online": true)
      # apply here, before the code that uses them, with the app live. A refusal
      # stops the release before anything changes; the installed code keeps
      # serving. A migration that is not online-safe is refused: ship it as
      # online steps instead (add the new shape, move readers, drop the old).
      - name: Apply reviewed online D1 migrations
        timeout-minutes: 10
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
        run: node scripts/apply-online-d1-migrations.mjs

      # A code release changes a Worker version, not its routes
      # and not its Cron triggers: only `wrangler deploy` installs
      # those. The Worker runs a recurring job only when the scheduled event's
      # trigger string is exactly an installed one, so a toml whose crons
      # differ from the installed ones stops every job without an error.
      # ARCHITECTURE FENCE [IPD-004]: preserve durable wake intent on code pushes.
      # Cloudflare also refuses version uploads that carry an unapplied Durable
      # Object migration; class lifecycle changes only go through
      # `wrangler deploy`. Ask Cloudflare which tag and which triggers are live
      # first, and switch this release to `wrangler deploy` when either differs
      # from the checked-in config (the toml owns the trigger set).
      # B-1069: sign-in seals its cookies with SESSION_SECRET. A stateful Worker
      # without it can't sign anyone in, so no release installs one.
      - name: Require the sign-in secret before deploying the stateful Worker
        timeout-minutes: 2
        run: |
          pnpm exec wrangler secret list --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml > /tmp/stateful-secret-names.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const names=new Set(JSON.parse(readFileSync("/tmp/stateful-secret-names.json","utf8")).map(item=>item.name)); if(!names.has("SESSION_SECRET")) throw new Error("Missing required Worker secret: SESSION_SECRET (B-1069)");'

      - name: Detect a pending Durable Object migration or cron trigger drift
        id: deploy_mode
        timeout-minutes: 2
        run: node scripts/stateful-worker-deploy-mode.mjs wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml

      - name: Deploy the compatible stateful Worker
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy_mode.outputs.needs_wrangler_deploy }}" = "true" ]; then
            pnpm exec wrangler deploy --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$ICONOPLASM_INSTALLED_SHA" --var "SENTRY_RELEASE:$GITHUB_SHA"
          else
            pnpm exec wrangler versions upload --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$ICONOPLASM_INSTALLED_SHA" --tag "code-prepages-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            pnpm exec wrangler versions deploy --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --version-tag "code-prepages-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --percentage 100 --yes
          fi

      - name: Deploy the compatible public edge Worker
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --env="" --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST" --tag "edge-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pnpm exec wrangler versions deploy --env="" --version-tag "edge-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --percentage 100 --yes

      # A version upload leaves routes alone, so every release checks them:
      # each pattern logs "Route already points at..." when it is right, and is
      # moved back to its owner when someone changed it.
      - name: Reassign production routes to the public edge worker
        run: |
          node scripts/reassign-cloudflare-worker-routes.mjs \
            brinedew.bio \
            the-only-allowed-public-edge-worker-that-must-not-touch-state \
            "brinedew.bio/api/*" \
            "geneguessr.brinedew.bio/api/*" \
            "geneguessr.brinedew.bio/admin*"

      # ARCHITECTURE FENCE [IPD-007]: Iconoplasm's matching static assets bypass Worker execution.
      # The mutable /blot/* alias and other dynamic routes go directly to the one
      # stateful runtime, without the old second public-proxy invocation.
      - name: Reassign Iconoplasm route to the stateful worker
        run: |
          node scripts/reassign-cloudflare-worker-routes.mjs \
            brinedew.bio \
            geneguessr-api \
            "iconoplasm.brinedew.bio/*"

      # B-898: the Bunny pull zone's CORS extensions and edge rules are owned by
      # bunny/the-only-iconoplasm-pull-zone-policy.json and applied through the
      # live Worker, which holds the account key. Never edit the zone by hand.
      - name: Reconcile the Iconoplasm Bunny pull zone policy
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: node scripts/reconcile-iconoplasm-pull-zone.mjs

      # Publish browser code last. Additive backend contracts are safe for the
      # previous frontend, while the reverse order can expose controls whose
      # migrations and authenticated handlers do not exist yet.
      - name: Deploy production static site to Cloudflare Pages
        working-directory: .wrangler-pages
        run: pnpm exec wrangler pages deploy ../public --project-name brinedew-bio --branch main

      # The stateful Worker must ship before browser code, but activating the final
      # HTML-shell cache key before Pages is live lets production traffic populate
      # that key with the previous deployment's asset URLs. Switch to the final key
      # only after Pages confirms the new static deployment.
      - name: Activate compatible Worker with current HTML shell cache version
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST" --tag "code-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pnpm exec wrangler versions deploy --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --version-tag "code-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --percentage 100 --yes

      # The Worker's trigger strings and the installed ones must be the same set
      # once every stateful deploy above has run, or the recurring jobs are
      # silently stopped.
      - name: Verify the installed cron triggers are the checked-in ones
        timeout-minutes: 2
        run: node scripts/stateful-worker-deploy-mode.mjs --verify wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml

      # B-858: the static edge policy says Cloudflare must not auto-inject its
      # Web Analytics beacon (that beacon runs before consent and makes our
      # consent-gated one stand down). Enforce it on every release instead of
      # trusting a one-off manual run.
      - name: Enforce the Web Analytics consent setting from the static edge policy
        timeout-minutes: 2
        run: node scripts/reconcile-brinedew-static-edge-policy.mjs --apply rules

      - name: Smoke test production host ownership and browser bootstraps
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"

          fetch_document() {
            local name="$1"
            local url="$2"
            curl \
              --fail \
              --location \
              --max-time 30 \
              --retry 5 \
              --retry-all-errors \
              --silent \
              --show-error \
              --dump-header "$smoke_dir/$name.headers" \
              --output "$smoke_dir/$name.html" \
              "$url"
          }

          fetch_document brinedew "https://brinedew.bio/?v=$CACHE_BUST"
          fetch_document geneguessr "https://geneguessr.brinedew.bio/?v=$CACHE_BUST"
          fetch_document iconoplasm "https://iconoplasm.brinedew.bio/?v=$CACHE_BUST"
          fetch_document settings "https://brinedew.bio/settings/index?v=$CACHE_BUST"

          # The old Quartz path must lead to the app's own hostname, where its
          # API and published-card requests share the correct origin and CSP.
          alias_result="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://brinedew.bio/apps/iconoplasm/?v=$CACHE_BUST")"
          test "$alias_result" = "301 https://iconoplasm.brinedew.bio/?v=$CACHE_BUST"
          gene_alias_result="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://brinedew.bio/apps/iconoplasm/gene/TP53?v=$CACHE_BUST")"
          test "$gene_alias_result" = "301 https://iconoplasm.brinedew.bio/gene/TP53?v=$CACHE_BUST"

          grep -Fq 'data-slug="index"' "$smoke_dir/brinedew.html"
          grep -Fq 'data-slug="apps/geneguessr/index"' "$smoke_dir/geneguessr.html"
          grep -Fq 'data-slug="apps/iconoplasm/index"' "$smoke_dir/iconoplasm.html"
          grep -Fq 'data-slug="settings/index"' "$smoke_dir/settings.html"
          # B-834: these documents are served by Pages directly (free static
          # requests). A Worker in front would add its marker header back.
          if grep -Fiq 'X-Brinedew-Static-Route' "$smoke_dir/brinedew.headers" ||
             grep -Fiq 'X-Brinedew-Static-Route' "$smoke_dir/geneguessr.headers"; then
            echo "A Worker is fronting brinedew.bio or GeneGuessr documents again." >&2
            exit 1
          fi
          grep -Fiq 'Content-Security-Policy:' "$smoke_dir/brinedew.headers"
          grep -Fiq "'unsafe-eval'" "$smoke_dir/geneguessr.headers"

      - name: Smoke test Discord OAuth entry and anonymous session contract
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          # The public edge Worker was deployed seconds ago. Give a new
          # version up to ~30 s to reach every edge before judging it, and
          # never let a missing header kill the step before it says what it
          # saw: on 25 Sep a transient non-302 had no Location header, grep
          # exited 1 under pipefail, and the run went red with no output.
          status=""
          location=""
          for attempt in 1 2 3 4 5 6; do
            curl -sS -D "$headers_file" -o /dev/null "https://brinedew.bio/api/auth/login?leaderboard_opt_in=0" || true
            status="$(awk 'NR==1 { print $2 }' "$headers_file")"
            location="$( (grep -i '^Location:' "$headers_file" || true) | head -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"
            [ "$status" = "302" ] && break
            echo "OAuth login attempt $attempt: status ${status:-none}; retrying in 5 s"
            sleep 5
          done

          echo "OAuth login status: $status"
          echo "OAuth redirect location: $location"

          if [ "$status" != "302" ]; then
            echo "Expected 302 from production /api/auth/login but got $status" >&2
            exit 1
          fi

          if [[ "$location" != https://discord.com/oauth2/authorize* ]]; then
            echo "Expected Discord OAuth redirect URL, got: $location" >&2
            exit 1
          fi

          if echo "$location" | grep -Eq 'client_id=(|undefined|null)($|&)'; then
            echo "Discord OAuth redirect has invalid client_id in production." >&2
            exit 1
          fi

          me_headers="$(mktemp)"
          me_body="$(mktemp)"
          me_status="$(curl --silent --show-error \
            --dump-header "$me_headers" \
            --output "$me_body" \
            --write-out '%{http_code}' \
            "https://brinedew.bio/api/auth/me")"
          if [ "$me_status" != "401" ]; then
            echo "Expected anonymous /api/auth/me to return 401, got $me_status" >&2
            exit 1
          fi
          grep -Eq '"authenticated"[[:space:]]*:[[:space:]]*false' "$me_body"
          grep -Fiq 'Cache-Control: no-store' "$me_headers"

      # B-847: an admitted operation that overran its verified bound has
      # already applied and been charged, so the release above carried on and
      # brought production back. The run still goes red here, after production
      # is safe, because that adapter stays refused until its bound is fixed.
      - name: Fail the run if any admitted operation overran its bound
        if: always()
        run: |
          if [ -s "$ICONOPLASM_COST_OVERRUN_LOG" ]; then
            echo "Admitted operations that overran their verified bound (applied and charged):" >&2
            cat "$ICONOPLASM_COST_OVERRUN_LOG" >&2
            exit 1
          fi

  post-deploy-production-acceptance:
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify production reader operation after deployment
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --max-time 30 "https://iconoplasm.brinedew.bio/?v=${{ github.sha }}" >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://iconoplasm.brinedew.bio/gene/TP53?v=${{ github.sha }}" >/dev/null
          # B-417: another site's text/plain POST carrying a cookie is refused before any route runs.
          forged=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 -X POST \
            "https://iconoplasm.brinedew.bio/api/iconoplasm/votes/set" \
            -H "Origin: https://cross-site.invalid" -H "Sec-Fetch-Site: cross-site" \
            -H "Cookie: session=acceptance-probe" -H "Content-Type: text/plain" --data '{}')
          test "$forged" = 403 || { echo "A cross-site POST with a cookie answered $forged, not 403 (B-417)"; exit 1; }
