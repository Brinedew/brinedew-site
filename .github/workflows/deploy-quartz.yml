name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: ["v2-quartz-migration", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pandas pyyaml python-frontmatter

      - name: Enrich protein pages
        run: python scripts/enrich-proteins.py

      - name: Upload image generation queue 
        if: always() 
        uses: actions/upload-artifact@v4 
        with: 
          name: image-generation-queue 
          path: image_generation_queue.txt 
          if-no-files-found: ignore 

      - name: Setup Node.js (22.x) with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify Node/npm and bump npm to >=10.9.2
        run: |
          node -v
          npm -v
          npm i -g npm@10.9.2
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: node quartz/bootstrap-cli.mjs build -d content

      - name: Verify Genedle assets bundled
        run: |
          ls -lah public/static/genedle
          grep -n "loadData" public/static/genedle/app.js
          test -s public/static/genedle/data.json
          test -s public/static/genedle/index.json

      - name: Ensure CNAME file exists
        run: |
          mkdir -p public
          if [ -f "content/CNAME" ]; then
            cp content/CNAME public/CNAME
          elif [ -f "CNAME" ]; then
            cp CNAME public/CNAME
          else
            echo "brinedew.com" > public/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
