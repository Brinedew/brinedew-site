name: Deploy Production (Cloudflare Pages + Worker)

on:
  push:
    branches: ["main"]
    # Agent runbooks and plans are outside Quartz's `content` build input. Do
    # not redeploy Workers and Pages for an operations-note-only change.
    paths-ignore:
      - "docs/**"
      - "plans/**"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Original failed production run whose migration plans must continue"
        required: false
        type: string
      reader_recovery_only:
        description: "Deploy only the tested D1-free published-card reader containment artifact"
        required: false
        default: false
        type: boolean
      data_maintenance:
        description: "Apply reviewed schema and state maintenance before the code release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  # Finish Worker + Pages activation together. A delayed old push must not
  # cancel a newer release halfway through its schema/publication transition.
  cancel-in-progress: false

jobs:
  reader-recovery-only:
    # This is an explicit containment dispatch, not a migration retry. It is
    # deliberately unreachable from push/schedule automation and cannot resume
    # queues, activate application writes, or stage a schema-dependent build.
    if: github.event_name == 'workflow_dispatch' && inputs.reader_recovery_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CACHE_BUST: ${{ github.sha }}
      ICONOPLASM_RELEASE_ORIGIN_RUN_ID: ${{ inputs.resume_run_id }}
      ICONOPLASM_READER_RECOVERY_ONLY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject stale production source before admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-production-head.mjs

      - name: Require successful tests for the exact deployed commit
        id: exact-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-iconoplasm-release-ci.mjs

      - name: Restore immutable static assets from the exact tested CI run
        uses: actions/download-artifact@v8
        with:
          name: iconoplasm-edge-assets-${{ github.sha }}
          path: public-iconoplasm-edge
          run-id: ${{ steps.exact-ci.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify restored immutable static asset bundle
        shell: bash
        run: |
          set -euo pipefail
          for asset in index.html privacy.html license.html caretaker-terms.html favicon.ico _headers; do
            test -f "public-iconoplasm-edge/${asset}"
          done

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate reader-recovery credentials
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_BUDGET_ANALYTICS_TOKEN:-}" ] || [ -z "${ICONOPLASM_ADMIN_TOKEN:-}" ]; then
            echo "Missing reader-recovery deployment credentials." >&2
            exit 1
          fi

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Verify the D1-free containment artifact
        run: |
          node scripts/run-tests.mjs \
            workers/b742-quarantine-gene-shell.test.js \
            scripts/b742-release-recovery.test.js \
            scripts/read-iconoplasm-release-state.test.js
          pnpm run validate:iconoplasm-topology

      - name: Read compatible installed state and non-D1 reader headroom
        id: reader-recovery-state
        timeout-minutes: 1
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/read-iconoplasm-release-state.mjs

      - name: Deploy the D1-free reader containment artifact
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/prepare-iconoplasm-schema-transition-config.mjs
          trap 'rm -f wrangler.iconoplasm-schema-transition.generated.toml' EXIT
          # These three are the non-Iconoplasm schedules. Queue delivery state
          # lives at the provider and is intentionally not changed by this job.
          node scripts/deploy-iconoplasm-reader-recovery.mjs --env="" --config wrangler.iconoplasm-schema-transition.generated.toml --var "ICONOPLASM_SCHEMA_TRANSITION:1" --var "ICONOPLASM_SCHEMA_TRANSITION_MODE:reader-recovery" --var "ICONOPLASM_MIGRATION_ORIGIN_RUN_ID:$ICONOPLASM_RELEASE_ORIGIN_RUN_ID" --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST-reader-recovery" --triggers "55 23 * * *" "3 0 * * *" "6 12 * * *"

      - name: Verify published readers and retained application protection
        timeout-minutes: 2
        run: node scripts/verify-iconoplasm-reader-recovery.mjs

  deploy-production:
    if: github.event_name != 'workflow_dispatch' || inputs.reader_recovery_only != true
    runs-on: ubuntu-latest
    # B-857: actions: write lets a superseded push cancel its own run (grey)
    # instead of failing red at the head check. Nothing else here uses it.
    permissions:
      contents: read
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CACHE_BUST: ${{ github.sha }}
      ICONOPLASM_RELEASE_ORIGIN_RUN_ID: ${{ inputs.resume_run_id }}
      ICONOPLASM_COST_OVERRUN_LOG: ${{ github.workspace }}/../iconoplasm-cost-overruns.jsonl
    steps:
      # Bump actions/checkout @v6 -> @v7 and actions/upload-artifact @v6 -> @v7
      # (2026 current majors). This workflow is the canonical production
      # deploy path; anything that touches it should also update the
      # "Canonical production deploy path" comment in scripts/deploy-cloudflare-prod.ps1.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject stale production source before admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-production-head.mjs

      - name: Protect previously published extension downloads
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/verify-iconoplasm-release-history.mjs

      # Exact-head ci.yaml already builds and runs the full test suite, including
      # the Worker budget and architecture checks. This gate prevents deployment
      # until that same commit passes; do not rerun a partial test list here.
      # ARCHITECTURE FENCE [IPD-001]: keep healthy Bunny portrait delivery.
      # ARCHITECTURE FENCE [IPD-005]: keep bounded D1 state and retention.
      # ARCHITECTURE FENCE [IPD-008]: keep anonymous reading off mutable state.
      - name: Require successful tests for the exact deployed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-iconoplasm-release-ci.mjs

      - name: Verify the code release against the installed revision
        if: inputs.data_maintenance != true
        run: node scripts/verify-code-release.mjs

      # This read-only sentinel performs no application D1 work. A pass does
      # not replace complete-release admission below. Existing maintenance
      # keeps its independent zero-D1 published-reader recovery path.
      - name: Reject exhausted capacity before release setup
        if: inputs.data_maintenance == true
        timeout-minutes: 1
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: node scripts/early-release-capacity-sentinel.mjs

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify Node/pnpm and dependency release delay
        run: |
          node -v
          pnpm -v
          pnpm config set minimumReleaseAge 1440
          pnpm config get minimumReleaseAge

      - name: Validate Cloudflare secrets
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${ICONOPLASM_ADMIN_TOKEN:-}" ]; then
            echo "Missing Cloudflare deployment credentials or the cost-operation admin secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Sync shared Iconoplasm assets before release guards
        run: pnpm run sync:iconoplasm-shared

      - name: Bake Iconoplasm observability snapshot (production)
        run: node scripts/generate-iconoplasm-observability-snapshot.mjs --env production

      - name: Build Quartz site
        run: pnpm run build

      - name: Prove exact built static route ownership
        run: node --test workers/iconoplasm-static-assets.workerd.test.js

      - name: Verify Geneguessr assets bundled
        run: |
          ls -lah public/static/geneguessr
          grep -n "bootstrapGame" public/static/geneguessr/app.js

      # Canonical production domain is brinedew.bio. The Linear project
      # "Brinedew.bio website" lists "brinedew.com as canonical domain" as
      # an obsolete assumption. The fallback here MUST match quartz.config.yaml
      # baseUrl (line 79) and the cname plugin (line 220), otherwise a missing
      # content/CNAME will silently re-point production at the dead domain.
      - name: Ensure CNAME file exists
        run: |
          mkdir -p public
          if [ -f "content/CNAME" ]; then
            cp content/CNAME public/CNAME
          elif [ -f "CNAME" ]; then
            cp CNAME public/CNAME
          else
            echo "brinedew.bio" > public/CNAME
          fi

      - name: Disable Jekyll processing
        run: |
          mkdir -p public
          touch public/.nojekyll

      # Pages validates the wrangler.toml in its current working directory and rejects
      # Worker-only keys like `main`, `routes`, and `triggers`. Keep the production
      # Worker config at repo root, but copy a tiny Pages-only config into an isolated
      # temp directory so this workflow remains the single canonical deploy path.
      - name: Prepare isolated Pages Wrangler config
        run: |
          mkdir -p .wrangler-pages
          cp wrangler.pages.toml .wrangler-pages/wrangler.toml

      - name: Verify operation cost implementation and migration identities
        run: |
          node scripts/generate-operation-cost-migrations.mjs --check
          node scripts/generate-operation-cost-identities.mjs --check

      - name: Validate Iconoplasm deployment topology
        run: pnpm run validate:iconoplasm-topology

      # A failed migration must not strand immutable readers behind its D1
      # allocation. Only refresh an ALREADY active transition, established from
      # provider settings, never inferred from a public HTTP failure. This is
      # the same state owner and canonical release; no schema or ledger changes.
      - name: Read installed schema-transition state and reader headroom
        if: inputs.data_maintenance == true
        id: release-state
        timeout-minutes: 1
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/read-iconoplasm-release-state.mjs

      - name: Refresh published readers during existing schema maintenance
        if: inputs.data_maintenance == true && steps.release-state.outputs.schema_transition == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/prepare-iconoplasm-schema-transition-config.mjs
          trap 'rm -f wrangler.iconoplasm-schema-transition.generated.toml' EXIT
          node scripts/deploy-iconoplasm-reader-recovery.mjs --env="" --config wrangler.iconoplasm-schema-transition.generated.toml --var "ICONOPLASM_SCHEMA_TRANSITION:1" --var "ICONOPLASM_SCHEMA_TRANSITION_MODE:reader-recovery" --var "ICONOPLASM_MIGRATION_ORIGIN_RUN_ID:$ICONOPLASM_RELEASE_ORIGIN_RUN_ID" --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST-backend" --triggers "55 23 * * *" "3 0 * * *" "6 12 * * *"

      - name: Verify published readers and retained application protection
        if: steps.release-state.outputs.schema_transition == 'true'
        timeout-minutes: 2
        run: node scripts/verify-iconoplasm-reader-recovery.mjs

      # ARCHITECTURE FENCE [IPD-012]: inspect the account allowance through
      # analytics before any migration reads; exhausted D1 is not a retry loop.
      - name: Require account-wide D1 and Worker headroom before migrations
        if: inputs.data_maintenance == true
        shell: pwsh
        timeout-minutes: 1
        run: |
          . ./scripts/lib/CloudflareWorkerRequestBudget.ps1
          Assert-CloudflareWorkerRequestHeadroom | ConvertTo-Json

      - name: Check account capacity before release mutations
        if: inputs.data_maintenance == true
        timeout-minutes: 1
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preflight-operation-cost-release.mjs

      - name: Require analytics secrets before staging the schema transition
        if: inputs.data_maintenance == true
        timeout-minutes: 1
        run: |
          pnpm exec wrangler secret list --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml > /tmp/iconoplasm-secret-names.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const names=new Set(JSON.parse(readFileSync("/tmp/iconoplasm-secret-names.json","utf8")).map(item=>item.name)); for(const name of ["CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_BUDGET_ANALYTICS_TOKEN"]) if(!names.has(name)) throw new Error("Missing required Worker secret: "+name);'

      # ARCHITECTURE FENCE [IPD-009]: validate the machine-readable topology
      # before uploading any Worker or reconciling a route. A CSS-only release
      # still has to deploy a cold-safe version of the one state owner.
      # ARCHITECTURE FENCE [IPD-003]: training ingestion is not the search
      # discovery contract. This WAF rule executes before the Worker and keeps
      # GPTBot/ClaudeBot from spending the daily request allowance while
      # OAI/Claude/Perplexity search and user-directed agents stay reachable.
      - name: Reconcile Iconoplasm training-crawler budget guard
        if: inputs.data_maintenance == true
        run: node scripts/reconcile-iconoplasm-crawler-policy.mjs brinedew.bio

      # ARCHITECTURE FENCE [IPD-007]: Cloudflare will not let `wrangler deploy`
      # claim a route still owned by another script. The stateful script is
      # uploaded before trigger reconciliation and is also the existing
      # service-binding target, so hand the route to that prepared target
      # before asking Wrangler to reconcile its declared route.
      - name: Hand off Iconoplasm route to the prepared stateful worker
        if: inputs.data_maintenance == true
        run: |
          node scripts/reassign-cloudflare-worker-routes.mjs \
            brinedew.bio \
            geneguessr-api \
            "iconoplasm.brinedew.bio/*"

      # ARCHITECTURE FENCE [IPD-004]: the materialization Queue is transport for
      # the bounded D1 ledger. Provision names before the Worker version binds
      # them; inspect exact names instead of parsing provider error prose.
      - name: Ensure requested gene-card Queues exist
        if: inputs.data_maintenance == true
        run: |
          set -euo pipefail
          for queue in iconoplasm-gene-card-materialization iconoplasm-gene-card-materialization-dlq; do
            if pnpm exec wrangler queues info "$queue" >/dev/null 2>&1; then
              echo "Queue $queue already exists"
              continue
            fi
            pnpm exec wrangler queues create "$queue"
            pnpm exec wrangler queues info "$queue" >/dev/null
          done

      # ARCHITECTURE FENCE [IPD-012]: admission must exist before DDL, while
      # application HTTP, queue consumers and periodic projection work wait
      # for schema readiness. These three steps must remain adjacent.
      # B-742: every state-owner upload retains the three independent GeneGuessr
      # schedules. Restore Iconoplasm cron work only with a reviewed capacity
      # release; neither a successful deploy nor a clock deadline is that proof.
      - name: Refresh account capacity immediately before pausing application work
        if: inputs.data_maintenance == true
        timeout-minutes: 1
        env:
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preflight-operation-cost-release.mjs

      - name: Stage migration admission in the existing state owner
        if: inputs.data_maintenance == true && steps.release-state.outputs.schema_transition != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/prepare-iconoplasm-schema-transition-config.mjs
          trap 'rm -f wrangler.iconoplasm-schema-transition.generated.toml' EXIT
          node scripts/deploy-iconoplasm-reader-recovery.mjs --env="" --config wrangler.iconoplasm-schema-transition.generated.toml --var "ICONOPLASM_SCHEMA_TRANSITION:1" --var "ICONOPLASM_SCHEMA_TRANSITION_MODE:reader-recovery" --var "ICONOPLASM_MIGRATION_ORIGIN_RUN_ID:$ICONOPLASM_RELEASE_ORIGIN_RUN_ID" --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST-backend" --triggers "55 23 * * *" "3 0 * * *" "6 12 * * *"

      - name: Inspect staged migration prerequisites through admission
        if: inputs.data_maintenance == true
        timeout-minutes: 2
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/inspect-operation-cost-release.mjs

      - name: Apply reviewed D1 migrations through prediction admission
        if: inputs.data_maintenance == true
        id: migrations
        timeout-minutes: 3
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-admitted-d1-migrations.mjs

      - name: Record staged migration continuation checkpoint
        if: steps.migrations.outputs.continuation_required == 'true'
        run: |
          echo "One individually admitted migration completed; retained schema-transition protection stays active."

      - name: Prepare the published catalog through shared KV admission
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        timeout-minutes: 2
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-admitted-catalog-initialization.mjs

      # Deploy the publisher while retaining the exact currently active asset
      # bundle and pre-cutover routing, then run its existing Durable Object
      # owner and wait for Bunny. Only the final activation uploads this build's
      # SPA assets and static-first routing. This is a 70-minute safe execution
      # window, not a completion forecast: the migration gets 50 minutes while
      # monotonic owner receipts reset a five-minute stall clock, then Bunny gets
      # four minutes and each Wrangler deploy is bounded at five. If the window
      # expires, retained assets/routes stay live and a rerun resumes idempotently.
      - name: Publish, verify, and activate immutable public reads
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        timeout-minutes: 70
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: node scripts/prepare-iconoplasm-public-read-cutover.mjs --release "$CACHE_BUST"

      - name: Ensure Iconoplasm finalization Queue consumer is bound
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        timeout-minutes: 2
        # ARCHITECTURE FENCE [IPD-004]: preserve delayed work and verify the
        # Wrangler-owned consumer instead of restoring CLI default batch sizes.
        run: node scripts/reconcile-iconoplasm-finalization-queue.mjs --apply

      # A code release changes a Worker version, not its routes, queue consumers,
      # or Cron triggers. Cloudflare manages those triggers separately from versions.
      # ARCHITECTURE FENCE [IPD-004]: preserve durable wake intent on code pushes.
      - name: Deploy the compatible stateful Worker
        if: inputs.data_maintenance != true
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$ICONOPLASM_INSTALLED_SHA" --tag "code-prepages-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pnpm exec wrangler versions deploy --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --version-tag "code-prepages-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --percentage 100 --yes

      - name: Deploy the compatible public edge Worker
        if: inputs.data_maintenance != true && steps.migrations.outputs.continuation_required != 'true'
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --env="" --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST" --tag "edge-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pnpm exec wrangler versions deploy --env="" --version-tag "edge-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --percentage 100 --yes

      - name: Upload public edge worker script with routes (production)
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        run: pnpm exec wrangler deploy --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST" --var "SENTRY_RELEASE:$GITHUB_SHA"

      - name: Reassign production routes to the public edge worker
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        run: |
          node scripts/reassign-cloudflare-worker-routes.mjs \
            brinedew.bio \
            the-only-allowed-public-edge-worker-that-must-not-touch-state \
            "brinedew.bio/api/*" \
            "geneguessr.brinedew.bio/api/*" \
            "geneguessr.brinedew.bio/admin*"

      # ARCHITECTURE FENCE [IPD-007]: Iconoplasm's matching static assets bypass Worker execution.
      # The mutable /blot/* alias and other dynamic routes go directly to the one
      # stateful runtime, without the old second public-proxy invocation.
      - name: Reassign Iconoplasm route to the stateful worker
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        run: |
          node scripts/reassign-cloudflare-worker-routes.mjs \
            brinedew.bio \
            geneguessr-api \
            "iconoplasm.brinedew.bio/*"

      # Publish browser code last. Additive backend contracts are safe for the
      # previous frontend, while the reverse order can expose controls whose
      # migrations and authenticated handlers do not exist yet.
      - name: Deploy production static site to Cloudflare Pages
        if: steps.migrations.outputs.continuation_required != 'true'
        working-directory: .wrangler-pages
        run: pnpm exec wrangler pages deploy ../public --project-name brinedew-bio --branch main

      # The stateful Worker must ship before browser code, but activating the final
      # HTML-shell cache key before Pages is live lets production traffic populate
      # that key with the previous deployment's asset URLs. Switch to the final key
      # only after Pages confirms the new static deployment.
      - name: Activate compatible Worker with current HTML shell cache version
        if: inputs.data_maintenance != true && steps.migrations.outputs.continuation_required != 'true'
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST" --tag "code-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pnpm exec wrangler versions deploy --env="" --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --version-tag "code-$CACHE_BUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --percentage 100 --yes

      - name: Activate current Iconoplasm HTML shell cache version
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        # The checked-in config owns the normal production trigger set. An
        # explicit --triggers list here previously carried the three-cron
        # reader-recovery containment into normal operation and silently
        # disabled every Iconoplasm background owner after each deployment.
        run: pnpm exec wrangler deploy --config wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:$CACHE_BUST" --var "SENTRY_RELEASE:$GITHUB_SHA"

      - name: Verify Iconoplasm publication aliases (production)
        if: inputs.data_maintenance == true && steps.migrations.outputs.continuation_required != 'true'
        run: pnpm run verify:iconoplasm-publication-aliases

      - name: Smoke test production host ownership and browser bootstraps
        if: steps.migrations.outputs.continuation_required != 'true'
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"

          fetch_document() {
            local name="$1"
            local url="$2"
            curl \
              --fail \
              --location \
              --max-time 30 \
              --retry 5 \
              --retry-all-errors \
              --silent \
              --show-error \
              --dump-header "$smoke_dir/$name.headers" \
              --output "$smoke_dir/$name.html" \
              "$url"
          }

          fetch_document brinedew "https://brinedew.bio/?v=$CACHE_BUST"
          fetch_document geneguessr "https://geneguessr.brinedew.bio/?v=$CACHE_BUST"
          fetch_document iconoplasm "https://iconoplasm.brinedew.bio/?v=$CACHE_BUST"
          fetch_document settings "https://brinedew.bio/settings/index?v=$CACHE_BUST"

          # The old Quartz path must lead to the app's own hostname, where its
          # API and published-card requests share the correct origin and CSP.
          alias_result="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://brinedew.bio/apps/iconoplasm/?v=$CACHE_BUST")"
          test "$alias_result" = "301 https://iconoplasm.brinedew.bio/?v=$CACHE_BUST"
          gene_alias_result="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://brinedew.bio/apps/iconoplasm/gene/TP53?v=$CACHE_BUST")"
          test "$gene_alias_result" = "301 https://iconoplasm.brinedew.bio/gene/TP53?v=$CACHE_BUST"

          grep -Fq 'data-slug="index"' "$smoke_dir/brinedew.html"
          grep -Fq 'data-slug="apps/geneguessr/index"' "$smoke_dir/geneguessr.html"
          grep -Fq 'data-slug="apps/iconoplasm/index"' "$smoke_dir/iconoplasm.html"
          grep -Fq 'data-slug="settings/index"' "$smoke_dir/settings.html"
          # B-834: these documents are served by Pages directly (free static
          # requests). A Worker in front would add its marker header back.
          if grep -Fiq 'X-Brinedew-Static-Route' "$smoke_dir/brinedew.headers" ||
             grep -Fiq 'X-Brinedew-Static-Route' "$smoke_dir/geneguessr.headers"; then
            echo "A Worker is fronting brinedew.bio or GeneGuessr documents again." >&2
            exit 1
          fi
          grep -Fiq 'Content-Security-Policy:' "$smoke_dir/brinedew.headers"
          grep -Fiq "'unsafe-eval'" "$smoke_dir/geneguessr.headers"

          for html in "$smoke_dir"/*.html; do
            if grep -Fq 'cdn.jsdelivr.net/npm/katex' "$html"; then
              echo "Production HTML still references CSP-blocked jsDelivr KaTeX: $html" >&2
              exit 1
            fi
          done

          if grep -Fq 'auth-sidebar.mjs' "$smoke_dir/geneguessr.html" ||
             grep -Fq 'auth-sidebar.mjs' "$smoke_dir/iconoplasm.html" ||
             grep -Fq 'auth-sidebar.mjs' "$smoke_dir/settings.html"; then
            echo "An app-owned account surface also loaded the generic auth sidebar." >&2
            exit 1
          fi

          grep -Fq '.split(";")' "$smoke_dir/iconoplasm.html"
          if grep -Fq '.split(/;s*/)' "$smoke_dir/iconoplasm.html"; then
            echo "Iconoplasm emitted the unsafe session-marker cookie parser." >&2
            exit 1
          fi

      - name: Smoke test Discord OAuth entry and anonymous session contract
        if: steps.migrations.outputs.continuation_required != 'true'
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          curl -sS -D "$headers_file" -o /dev/null "https://brinedew.bio/api/auth/login?leaderboard_opt_in=0"

          status="$(awk 'NR==1 { print $2 }' "$headers_file")"
          location="$(grep -i '^Location:' "$headers_file" | head -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"

          echo "OAuth login status: $status"
          echo "OAuth redirect location: $location"

          if [ "$status" != "302" ]; then
            echo "Expected 302 from production /api/auth/login but got $status" >&2
            exit 1
          fi

          if [[ "$location" != https://discord.com/oauth2/authorize* ]]; then
            echo "Expected Discord OAuth redirect URL, got: $location" >&2
            exit 1
          fi

          if echo "$location" | grep -Eq 'client_id=(|undefined|null)($|&)'; then
            echo "Discord OAuth redirect has invalid client_id in production." >&2
            exit 1
          fi

          me_headers="$(mktemp)"
          me_body="$(mktemp)"
          me_status="$(curl --silent --show-error \
            --dump-header "$me_headers" \
            --output "$me_body" \
            --write-out '%{http_code}' \
            "https://brinedew.bio/api/auth/me")"
          if [ "$me_status" != "401" ]; then
            echo "Expected anonymous /api/auth/me to return 401, got $me_status" >&2
            exit 1
          fi
          grep -Eq '"authenticated"[[:space:]]*:[[:space:]]*false' "$me_body"
          grep -Fiq 'Cache-Control: no-store' "$me_headers"

      # B-847: an admitted operation that overran its verified bound has
      # already applied and been charged, so the release above carried on and
      # brought production back. The run still goes red here, after production
      # is safe, because that adapter stays refused until its bound is fixed.
      - name: Fail the run if any admitted operation overran its bound
        if: always()
        run: |
          if [ -s "$ICONOPLASM_COST_OVERRUN_LOG" ]; then
            echo "Admitted operations that overran their verified bound (applied and charged):" >&2
            cat "$ICONOPLASM_COST_OVERRUN_LOG" >&2
            exit 1
          fi

  post-deploy-production-acceptance:
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify production reader operation after deployment
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --max-time 30 "https://iconoplasm.brinedew.bio/?v=${{ github.sha }}" >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://iconoplasm.brinedew.bio/gene/TP53?v=${{ github.sha }}" >/dev/null
