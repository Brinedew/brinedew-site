name: Discord Daily Recap

on:
  schedule:
    # Run at 00:05 UTC daily (5 minutes after day change)
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Override day (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  post-recap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright with OS deps
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Determine day
        id: day
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            echo "day=${{ inputs.day }}" >> $GITHUB_OUTPUT
            echo "Using override day: ${{ inputs.day }}"
          else
            # Yesterday in UTC (recap is for the day that just ended)
            DAY=$(date -u -d 'yesterday' +%Y-%m-%d)
            echo "day=$DAY" >> $GITHUB_OUTPUT
            echo "Using yesterday: $DAY"
          fi

      - name: Fetch recap data
        id: recap
        env:
          BOT_CRON_TOKEN: ${{ secrets.BOT_CRON_TOKEN }}
        run: |
          echo "Fetching recap for ${{ steps.day.outputs.day }}..."
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $BOT_CRON_TOKEN" \
            "https://geneguessr.brinedew.bio/api/discord/daily-summary?day=${{ steps.day.outputs.day }}" \
            || echo '{"error": "fetch_failed"}')

          echo "Response: $RESPONSE"

          # Check for errors
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error')
            echo "Error: $ERROR"
            if [ "$ERROR" = "No puzzle data for this day" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "No puzzle data - skipping"
              exit 0
            fi
            exit 1
          fi

          # Check if already posted
          if echo "$RESPONSE" | jq -e '.already_posted == true' > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already posted - skipping"
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          # Save response to file for the posting script
          echo "$RESPONSE" > recap-data.json

          # Extract key fields for logging
          GENE=$(echo "$RESPONSE" | jq -r '.target.gene')
          WINNERS=$(echo "$RESPONSE" | jq -r '.winners_count')
          echo "Target: $GENE, Winners: $WINNERS"

      - name: Install Xvfb
        if: steps.recap.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Take screenshot
        if: steps.recap.outputs.skip != 'true'
        run: |
          echo "Taking screenshot of structure..."
          RENDER_URL="https://geneguessr.brinedew.bio/apps/geneguessr/render?day=${{ steps.day.outputs.day }}&mode=structure"
          echo "URL: $RENDER_URL"

          # Run headful Chromium under Xvfb for WebGL support
          xvfb-run --auto-servernum --server-args='-screen 0 800x600x24' \
            node scripts/take-screenshot.js "$RENDER_URL" screenshot.png

          echo "Screenshot saved:"
          ls -la screenshot.png

      - name: Post to Discord
        if: steps.recap.outputs.skip != 'true'
        id: post
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_GENEGUESSR_CHANNEL_ID }}
        run: node scripts/discord-post-recap.js

      - name: Mark as posted
        if: steps.recap.outputs.skip != 'true' && steps.post.outputs.message_id != ''
        env:
          BOT_CRON_TOKEN: ${{ secrets.BOT_CRON_TOKEN }}
        run: |
          echo "Marking day ${{ steps.day.outputs.day }} as posted..."
          curl -sf -X POST \
            -H "Authorization: Bearer $BOT_CRON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"day": "${{ steps.day.outputs.day }}", "message_id": "${{ steps.post.outputs.message_id }}"}' \
            "https://geneguessr.brinedew.bio/api/discord/mark-posted"
          echo "Done!"
