name: Iconoplasm Viral Load Task 5 Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: iconoplasm-viral-load-task5-${{ github.sha }}
  cancel-in-progress: false

jobs:
  produce-iconoplasm-viral-load-task5-evidence:
    runs-on: [self-hosted, iconoplasm-task5-staging]
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - run: pnpm config set minimumReleaseAge 1440 && pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Create immutable evidence workspace
        run: mkdir -p artifacts/iconoplasm-viral-load-gates/task5/raw
      - name: Capture provider meters before the isolated workload
        env:
          ICONOPLASM_STAGING_BASE_URL: ${{ vars.ICONOPLASM_STAGING_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
        run: node scripts/run-iconoplasm-task5-external-profile.mjs --profile=provider-before --output=artifacts/iconoplasm-viral-load-gates/task5/provider-before.json --commit=${{ github.sha }} --environment=staging
      - name: Run exact authenticated TP53 workload with concurrent static reads
        env:
          ICONOPLASM_STAGING_SESSION_COOKIE: ${{ secrets.ICONOPLASM_STAGING_SESSION_COOKIE }}
        run: node scripts/iconoplasm-viral-load-task5-driver.mjs --base-url=${{ vars.ICONOPLASM_STAGING_BASE_URL }} --day=$(date -u +%F) --asset-sha256=${{ vars.ICONOPLASM_TASK5_TP53_ASSET_SHA256 }} --commit=${{ github.sha }} --environment=staging --output=artifacts/iconoplasm-viral-load-gates/task5/raw/hosted-driver.json
      - name: Produce authenticated browser, regional, Bunny, fault, and quantitative shed receipts
        env:
          ICONOPLASM_STAGING_BASE_URL: ${{ vars.ICONOPLASM_STAGING_BASE_URL }}
          ICONOPLASM_STAGING_SESSION_COOKIE: ${{ secrets.ICONOPLASM_STAGING_SESSION_COOKIE }}
          ICONOPLASM_TASK5_FAULT_TOKEN: ${{ secrets.ICONOPLASM_TASK5_FAULT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for profile in \
            browser region-apac region-eu region-us bunny \
            fault-stale-pointer fault-bunny-outage fault-expired-artifact \
            fault-laptop-off fault-d1-exhaustion fault-queue-exhaustion \
            fault-delayed-projection \
            shed-100000-discovery shed-100000-vote shed-100000-publication \
            shed-1000000-discovery shed-1000000-vote shed-1000000-publication \
            shed-1000000-worker shed-1000000-durable_object
          do
            node scripts/run-iconoplasm-task5-external-profile.mjs \
              --profile="$profile" \
              --output="artifacts/iconoplasm-viral-load-gates/task5/raw/$profile.json" \
              --commit=${{ github.sha }} \
              --environment=staging
          done
      - name: Capture provider delta for exactly this workload window
        env:
          ICONOPLASM_STAGING_BASE_URL: ${{ vars.ICONOPLASM_STAGING_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUDGET_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_BUDGET_ANALYTICS_TOKEN }}
          ICONOPLASM_TASK5_PROVIDER_BEFORE: artifacts/iconoplasm-viral-load-gates/task5/provider-before.json
        run: node scripts/run-iconoplasm-task5-external-profile.mjs --profile=provider-query --output=artifacts/iconoplasm-viral-load-gates/task5/raw/provider-query.json --commit=${{ github.sha }} --environment=staging
      - name: Compose canonical digest-bound Task 5 evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-iconoplasm-viral-load-staging-evidence.mjs --commit=${{ github.sha }} --environment=staging
      - name: Upload exact immutable Task 5 evidence
        uses: actions/upload-artifact@v7
        with:
          name: iconoplasm-viral-load-task5-evidence-${{ github.sha }}
          path: artifacts/iconoplasm-viral-load-gates/task5
          if-no-files-found: error
