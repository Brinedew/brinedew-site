name: Prepare immutable Iconoplasm release

# Called only by the human-gated store workflows. Both stores share one archive.
on:
  workflow_call:
    inputs:
      expected_version:
        required: true
        type: string
      expected_commit:
        required: true
        type: string
      human_confirmation:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  # The Firefox and Edge workflows both call this one. Whichever runs first
  # seals the release, and only after the Firefox PDF suite passed on this
  # commit, so a sealed release already carries that verdict. The second store
  # reuses it instead of running the suite again against that day's newest
  # Firefox and the live API: on 2026-10-24 the 0.5.11 Edge run failed the
  # suite on the commit that the Firefox run had just passed and sealed.
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      sealed: ${{ steps.archive.outputs.sealed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Inspect immutable archive
        id: archive
        run: node scripts/iconoplasm-release-bundle.mjs inspect

  firefox-pdf-e2e:
    needs: archive
    if: needs.archive.outputs.sealed != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/firefox-pdf-e2e.yml

  prepare:
    needs: [archive, firefox-pdf-e2e]
    if: >-
      always() && needs.archive.result == 'success' &&
      (needs.firefox-pdf-e2e.result == 'success' ||
      (needs.firefox-pdf-e2e.result == 'skipped' && needs.archive.outputs.sealed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: iconoplasm-immutable-${{ inputs.expected_version }}
      cancel-in-progress: false
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      HUMAN_CONFIRMATION: ${{ inputs.human_confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify human release gate and pinned dispatch
        shell: bash
        run: |
          test "$HUMAN_CONFIRMATION" = 'YES, I AM A HUMAN, PUBLISH ICONOPLASM'
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = "refs/tags/iconoplasm-v$EXPECTED_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require successful tests for the exact release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-iconoplasm-release-ci.mjs
      - name: Inspect immutable archive
        id: archive
        run: node scripts/iconoplasm-release-bundle.mjs inspect
      - name: Require certified browser ownership
        if: steps.archive.outputs.sealed != 'true'
        run: |
          node scripts/verify-iconoplasm-pdf-release-gate.mjs --target=firefox
          node scripts/verify-iconoplasm-pdf-release-gate.mjs --target=edge
      - name: Build the release bundles once
        if: steps.archive.outputs.sealed != 'true'
        run: |
          pnpm run sync:iconoplasm-extension
          node scripts/package-iconoplasm-extension.mjs --target=generic --release "--expected-version=$EXPECTED_VERSION"
          node scripts/package-iconoplasm-extension.mjs --target=firefox --release "--expected-version=$EXPECTED_VERSION"
          node scripts/package-iconoplasm-extension.mjs --target=edge --release "--expected-version=$EXPECTED_VERSION"
          node scripts/package-iconoplasm-firefox-source.mjs --release "--expected-version=$EXPECTED_VERSION"
      - name: Reproduce Firefox from the reviewer source
        if: steps.archive.outputs.sealed != 'true'
        run: node scripts/verify-iconoplasm-firefox-source-rebuild.mjs --release
      - name: Verify uploaded bytes and seal the release
        if: steps.archive.outputs.sealed != 'true'
        run: node scripts/iconoplasm-release-bundle.mjs seal
