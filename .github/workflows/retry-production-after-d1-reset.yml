name: Recover Production Safely After D1 Reset

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/retry-production-after-d1-reset.yml"
  schedule:
    # Reassert provider containment immediately before the Sep 17 UTC reset.
    - cron: "55 23 * * *"
    # Dense retry while the fresh day begins. Each tick asserts quarantine first,
    # then dispatches only an exact-main green release whose prior failure is a
    # proven pre-mutation capacity gate.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-6 * * *"
    # Continue through the rest of Sep 17 so a source repair completed after the
    # morning window can still deploy in the SAME fresh UTC day. The hard
    # quarantine prevents waiting for code from consuming D1 in the meantime.
    - cron: "2,12,22,32,42,52 7-23 * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: production-d1-reset-recovery
  cancel-in-progress: false

jobs:
  recover-production:
    # One-shot B-742 recurrence control for Sep 17. Scheduled invocations are
    # accepted only on Sep 16/17 UTC by the first step and become inert afterward.
    # Manual emergency containment stays available after this one-shot expires.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      DEPLOY_WORKFLOW: deploy-quartz.yml
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SCRIPT_NAME: geneguessr-api
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Keep the fresh D1 day safe and drive the canonical release
        shell: bash
        run: |
          set -euo pipefail

          utc_day="$(date -u +%F)"
          if [[ "${EVENT_NAME:-}" == "schedule" && "${utc_day}" != "2026-09-16" && "${utc_day}" != "2026-09-17" ]]; then
            echo "One-shot Sep 17 recovery driver has expired; scheduled run is inert."
            exit 0
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare credentials are missing; recovery cannot safely change provider controls." >&2
            exit 1
          fi

          # The scheduled one-shot covers the complete Sep 17 UTC day. Manual
          # emergency use outside that day remains containment-only unless the
          # current day is Sep 17; no calendar rollover creates a new migration
          # lineage automatically.
          if [[ "${EVENT_NAME:-}" == "schedule" && "${utc_day}" == "2026-09-16" ]]; then
            utc_hour="$(date -u +%H)"
            if [[ "${utc_hour}" != "23" ]]; then
              echo "Pre-reset scheduled control is only valid during 23:00 UTC on Sep 16."
              exit 0
            fi
          fi

          SAFE_CRONS='[
            {"cron":"55 23 * * *"},
            {"cron":"3 0 * * *"},
            {"cron":"6 12 * * *"}
          ]'
          ICONOPLASM_QUEUES=(
            "iconoplasm-sync-finalization"
            "iconoplasm-vote-projection"
            "iconoplasm-gene-card-materialization"
          )

          cf_rest() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local args=(
              -fsS
              --retry 3
              --retry-all-errors
              --connect-timeout 10
              --max-time 30
              -X "${method}"
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
              -H "Accept: application/json"
            )
            if [[ -n "${body}" ]]; then
              args+=(-H "Content-Type: application/json" --data "${body}")
            fi
            local response
            response="$(curl "${args[@]}" "https://api.cloudflare.com/client/v4/${path}")"
            if ! jq -e '.success == true' <<<"${response}" >/dev/null; then
              echo "Cloudflare API ${method} ${path} failed:" >&2
              jq -c '{errors,messages}' <<<"${response}" >&2 || true
              return 1
            fi
            printf '%s' "${response}"
          }

          queue_inventory() {
            cf_rest GET "accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?per_page=100"
          }

          set_queue_pause_state() {
            local paused="$1"
            local inventory
            inventory="$(queue_inventory)"
            local queue
            for queue in "${ICONOPLASM_QUEUES[@]}"; do
              local queue_id
              queue_id="$(
                jq -r --arg name "${queue}" \
                  '[.result[] | select(.queue_name == $name)] | if length == 1 then .[0].queue_id else empty end' \
                  <<<"${inventory}"
              )"
              if [[ -z "${queue_id}" ]]; then
                echo "Expected Iconoplasm queue '${queue}' was not uniquely found; refusing partial recovery." >&2
                return 1
              fi
              cf_rest PATCH \
                "accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${queue_id}" \
                "$(jq -nc --argjson paused "${paused}" '{settings:{delivery_paused:$paused}}')" \
                >/dev/null
              echo "Queue ${queue}: delivery_paused=${paused}"
            done
          }

          quarantine_background() {
            # Provider-side controls do not execute D1. Cron triggers are replaced
            # with the three independent GeneGuessr schedules; Iconoplasm queues retain
            # their messages while delivery is paused.
            cf_rest PUT \
              "accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}/schedules" \
              "${SAFE_CRONS}" \
              >/dev/null
            set_queue_pause_state true
            echo "B-742 quarantine asserted: Iconoplasm Cron jobs disabled and Queue delivery paused."
          }

          read_d1_usage() {
            local utc_day body response
            utc_day="$(date -u +%F)"
            body="$(
              jq -nc --arg account "${CLOUDFLARE_ACCOUNT_ID}" --arg day "${utc_day}" '{
                query: "query B742D1Recovery($accountTag: string, $day: Date) { viewer { accounts(filter: { accountTag: $accountTag }) { d1AnalyticsAdaptiveGroups(limit: 1000, filter: { date_geq: $day, date_leq: $day }) { dimensions { date databaseId } sum { rowsRead rowsWritten } } } } }",
                variables: {accountTag:$account, day:$day}
              }'
            )"
            response="$(
              curl -fsS \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 10 \
                --max-time 30 \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${body}" \
                "https://api.cloudflare.com/client/v4/graphql"
            )"
            if jq -e '(.errors // []) | length > 0' <<<"${response}" >/dev/null; then
              echo "Cloudflare D1 telemetry returned GraphQL errors." >&2
              jq -c '.errors' <<<"${response}" >&2
              return 1
            fi
            local accounts
            accounts="$(jq '.data.viewer.accounts | length' <<<"${response}")"
            if [[ "${accounts}" != "1" ]]; then
              echo "Cloudflare D1 telemetry did not return exactly one account." >&2
              return 1
            fi
            jq -c '{
              reads: ([.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead] | add // 0),
              writes: ([.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten] | add // 0)
            }' <<<"${response}"
          }

          # Quarantine is the fail-safe state for every invocation. This proves
          # provider credentials and keeps fresh capacity available even if the
          # repair head is red, the laptop is off, or the canonical deploy fails.
          quarantine_background

          usage="$(read_d1_usage)"
          reads="$(jq -r '.reads' <<<"${usage}")"
          writes="$(jq -r '.writes' <<<"${usage}")"
          echo "Current UTC-day D1 telemetry: ${reads} reads / ${writes} writes."

          # Sep 16 is containment-only. Never dispatch before the fresh UTC day.
          if [[ "${utc_day}" != "2026-09-17" ]]; then
            echo "Pre-reset containment complete; canonical release waits for Sep 17 UTC capacity."
            exit 0
          fi

          head_sha="$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')"
          checks_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100"
          )"
          ci_conclusion="$(
            jq -r \
              '([.check_runs[] | select(.name == "build-and-test")] | sort_by(.completed_at // .started_at // .created_at) | last | .conclusion) // ""' \
              <<<"${checks_json}"
          )"

          runs_json="$(
            gh api "repos/${REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?branch=main&per_page=100"
          )"
          latest_successful_attempt_id="$(
            jq -r --arg sha "${head_sha}" \
              '([.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | sort_by([(.run_started_at // .created_at), (.run_attempt // 1), .id]) | last | select(.conclusion == "success") | .id) // empty' \
              <<<"${runs_json}"
          )"
          successful_run_id=""
          staged_run_id=""
          completed_jobs_json='{}'
          if [[ -n "${latest_successful_attempt_id}" ]]; then
            completed_jobs_json="$(
              gh api "repos/${REPOSITORY}/actions/runs/${latest_successful_attempt_id}/jobs?filter=latest&per_page=100"
            )"
            if ! jq -e '(.jobs | type) == "array" and .total_count == (.jobs | length)' <<<"${completed_jobs_json}" >/dev/null; then
              echo "Full-deployment job evidence is invalid or incomplete; retaining quarantine." >&2
              exit 1
            fi
            if jq -e '
              [.jobs[] | select(.name == "deploy-production")] as $full |
              ($full | length) == 1 and
              $full[0].status == "completed" and $full[0].conclusion == "success" and
              ([
                "Deploy the only allowed internal stateful worker (production)",
                "Deploy production static site to Cloudflare Pages",
                "Activate current Iconoplasm HTML shell cache version",
                "Smoke test production host ownership and browser bootstraps",
                "Smoke test Discord OAuth entry and anonymous session contract"
              ] | all(. as $name |
                ([$full[0].steps[]? | select(.name == $name and .status == "completed" and .conclusion == "success")] | length) == 1
              ))
            ' <<<"${completed_jobs_json}" >/dev/null; then
              successful_run_id="${latest_successful_attempt_id}"
            fi
          fi

          if [[ -n "${successful_run_id}" ]]; then
            echo "Current main already deployed successfully in run ${successful_run_id}; retaining background quarantine until functional acceptance releases it."
            exit 0
          fi

          if [[ -n "${latest_successful_attempt_id}" ]] && jq -e '
            [.jobs[] | select(.name == "deploy-production")] as $full |
            ($full | length) == 1 and
            $full[0].status == "completed" and $full[0].conclusion == "success" and
            ([
              "Verify published readers and retained application protection",
              "Apply reviewed D1 migrations through prediction admission",
              "Record staged migration continuation checkpoint"
            ] | all(. as $name |
              ([$full[0].steps[]? | select(.name == $name and .status == "completed" and .conclusion == "success")] | length) == 1
            )) and
            ([
              "Prepare the published catalog through shared KV admission",
              "Activate current Iconoplasm HTML shell cache version"
            ] | all(. as $name |
              ([$full[0].steps[]? | select(.name == $name and .conclusion == "skipped")] | length) == 1
            ))
          ' <<<"${completed_jobs_json}" >/dev/null; then
            staged_run_id="${latest_successful_attempt_id}"
          fi

          if [[ "${ci_conclusion}" != "success" ]]; then
            echo "Exact-main protected CI is ${ci_conclusion:-absent}; quarantine stays active and no deploy is dispatched."
            exit 0
          fi

          active_run_id="$(
            jq -r --arg sha "${head_sha}" \
              '([.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | sort_by(.created_at) | last | .id) // empty' \
              <<<"${runs_json}"
          )"
          if [[ -n "${active_run_id}" ]]; then
            echo "Canonical deploy ${active_run_id} is already active; quarantine remains asserted."
            exit 0
          fi

          if [[ -z "${staged_run_id}" ]]; then
            latest_failed_run_id="$(
              jq -r --arg sha "${head_sha}" \
                '([.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "failure")] | sort_by(.created_at) | last | .id) // empty' \
                <<<"${runs_json}"
            )"
            if [[ -z "${latest_failed_run_id}" ]]; then
              echo "No retry-safe failed canonical deploy exists yet; the next controller tick will re-evaluate."
              exit 0
            fi

            jobs_json="$(
              gh api "repos/${REPOSITORY}/actions/runs/${latest_failed_run_id}/jobs?per_page=100"
            )"
            failed_step="$(
              jq -r '[.jobs[] | select(.name == "deploy-production") | .steps[]? | select(.conclusion == "failure") | .name] | last // ""' <<<"${jobs_json}"
            )"

            case "${failed_step}" in
              "Reject exhausted capacity before release setup"|\
              "Require account-wide D1 and Worker headroom before migrations"|\
              "Check account capacity before release mutations"|\
              "Refresh account capacity immediately before pausing application work")
                ;;
              *)
                echo "Latest canonical deploy failed at '${failed_step:-unknown}'."
                echo "This is not a proven retry-safe pre-mutation budget gate; quarantine remains active and automatic retry stops until that same failure is repaired on main."
                exit 0
                ;;
            esac
          fi

          # Preserve enough same-day headroom for the reviewed release. If this
          # threshold is reached, quarantine remains and engineering continues;
          # the controller never manufactures a refund or a new day.
          if (( reads >= 1500000 || writes >= 30000 )); then
            echo "Current D1 usage is too high for a protected migration attempt; quarantine remains active."
            exit 0
          fi

          echo "Dispatching canonical production deploy for ${head_sha}; normal CI, headroom, migration, activation, and smoke gates remain authoritative."
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/dispatches" \
            -f ref=main
