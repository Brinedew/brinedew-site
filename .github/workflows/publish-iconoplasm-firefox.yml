name: Publish Iconoplasm Firefox extension

# Store publish is deliberately workflow_dispatch-only. The supported trigger
# surface is the local Iconoplasm GUI's human release gate, not pushes, cron, or
# unattended LLM/CLI automation.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: AMO signing channel
        required: true
        default: listed
        type: choice
        options:
          - listed
          - unlisted
      human_confirmation:
        description: "Type exactly: YES, I AM A HUMAN, PUBLISH ICONOPLASM"
        required: true
        type: string
      expected_version:
        description: Version declared by the human publisher authority
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-firefox:
    # Re-platformed from windows-latest to ubuntu-latest. PowerShell 7 is
    # preinstalled on GitHub-hosted Linux runners, and the web-ext sign/lint
    # steps run via pnpm and Node, both fully cross-platform. See
    # publish-iconoplasm-edge.yml for the matching rationale.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      # Bump actions/checkout @v4 -> @v7 and actions/setup-node @v4 -> @v6
      # (2026 current majors).
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Confirm human publish intent
        env:
          HUMAN_CONFIRMATION: ${{ inputs.human_confirmation }}
        run: |
          if ($env:HUMAN_CONFIRMATION -ne "YES, I AM A HUMAN, PUBLISH ICONOPLASM") {
            throw "Firefox store publish requires the exact human confirmation phrase from the Iconoplasm GUI."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable

      - name: Check AMO secrets
        run: |
          if (-not "${{ secrets.AMO_JWT_ISSUER }}") {
            throw 'Missing GitHub secret AMO_JWT_ISSUER'
          }
          if (-not "${{ secrets.AMO_JWT_SECRET }}") {
            throw 'Missing GitHub secret AMO_JWT_SECRET'
          }

      - name: Verify human publisher authority
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node ./scripts/verify-iconoplasm-publisher-authority.mjs --expected="$env:EXPECTED_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension payload
        run: pnpm run package:iconoplasm-firefox

      - name: Lint Firefox package
        run: pnpm exec web-ext lint --source-dir iconoplasm-extension/dist/firefox-package

      - name: Submit to Firefox Add-ons
        run: |
          pnpm exec web-ext sign `
            --source-dir iconoplasm-extension/dist/firefox-package `
            --artifacts-dir iconoplasm-extension/dist/firefox-signed `
            --channel ${{ inputs.channel }} `
            --api-key ${{ secrets.AMO_JWT_ISSUER }} `
            --api-secret ${{ secrets.AMO_JWT_SECRET }}

      # Bump actions/upload-artifact @v4 -> @v7 (2026 current major). Both
      # upload steps share the same action pin.
      - name: Upload unsigned zip
        uses: actions/upload-artifact@v7
        with:
          name: iconoplasm-firefox-source-bundle
          path: iconoplasm-extension/dist/iconoplasm-firefox-v*.zip
          if-no-files-found: error

      - name: Upload signed Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: iconoplasm-firefox-signed
          path: iconoplasm-extension/dist/firefox-signed/**/*
          if-no-files-found: error
