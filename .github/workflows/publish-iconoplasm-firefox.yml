name: Publish Iconoplasm Firefox extension

# Store publish is deliberately workflow_dispatch-only. The supported trigger
# surface is the local Iconoplasm GUI's human release gate, not pushes, cron, or
# unattended LLM/CLI automation.
on:
  workflow_dispatch:
    inputs:
      human_confirmation:
        description: "Type exactly: YES, I AM A HUMAN, PUBLISH ICONOPLASM"
        required: true
        type: string
      expected_version:
        description: Version declared by the human publisher authority
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish-firefox:
    # Re-platformed from windows-latest to ubuntu-latest. PowerShell 7 is
    # preinstalled on GitHub-hosted Linux runners, and the locked store publisher
    # runs via pnpm and Node. See
    # publish-iconoplasm-edge.yml for the matching rationale.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      # Bump actions/checkout @v4 -> @v7 and actions/setup-node @v4 -> @v6
      # (2026 current majors).
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Confirm human publish intent
        env:
          HUMAN_CONFIRMATION: ${{ inputs.human_confirmation }}
        run: |
          if ($env:HUMAN_CONFIRMATION -ne "YES, I AM A HUMAN, PUBLISH ICONOPLASM") {
            throw "Firefox store publish requires the exact human confirmation phrase from the Iconoplasm GUI."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable

      - name: Check AMO secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if (-not $env:AMO_JWT_ISSUER) {
            throw 'Missing GitHub secret AMO_JWT_ISSUER'
          }
          if (-not $env:AMO_JWT_SECRET) {
            throw 'Missing GitHub secret AMO_JWT_SECRET'
          }

      - name: Verify human publisher authority
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node ./scripts/verify-iconoplasm-publisher-authority.mjs --expected="$env:EXPECTED_VERSION"

      - name: Require successful Build and Test for this release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/wait-for-iconoplasm-release-ci.mjs

      - name: Require a certified Firefox PDF ownership adapter
        run: node ./scripts/verify-iconoplasm-pdf-release-gate.mjs --target=firefox

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension payload
        run: pnpm run package:iconoplasm-firefox

      - name: Package reviewer source
        run: pnpm run package:iconoplasm-firefox-source

      - name: Submit to Firefox Add-ons
        env:
          FIREFOX_CHANNEL: listed
          FIREFOX_EXTENSION_ID: iconoplasm@brinedew.bio
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          FIREFOX_ZIP: iconoplasm-extension/dist/iconoplasm-firefox-v${{ inputs.expected_version }}.zip
          FIREFOX_SOURCES_ZIP: iconoplasm-extension/dist/iconoplasm-firefox-source-v${{ inputs.expected_version }}.zip
        run: pnpm exec publish-extension

      # Keep the exact payload and reviewer source that were sent to AMO, even if
      # AMO rejects the submission. Signed builds remain the store's authority.
      - name: Upload Firefox submission bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iconoplasm-firefox-submission
          path: |
            iconoplasm-extension/dist/iconoplasm-firefox-v*.zip
            iconoplasm-extension/dist/iconoplasm-firefox-source-v*.zip
          if-no-files-found: error
