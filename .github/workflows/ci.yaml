name: Build and Test

on:
  pull_request:
    branches:
      - main
      - v5
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A clean run takes 11-16 minutes. Without a limit GitHub waits 6 hours: on
    # 2026-10-09 a hung browser E2E held main's test run, and every production
    # deploy queued behind it ("Require successful tests for the exact deployed commit").
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      # Bump actions/checkout @v6 -> @v7 and actions/cache @v5 -> @v6 (2026
      # current majors). setup-node @v6 is already the latest. Dependabot
      # version-updates covers npm dependencies; this project explicitly pins
      # GitHub Actions to majors instead of SHA so Dependabot can PR drift.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Notes fast path: a change that only edits notes (content/, except the
      # Iconoplasm app pages in content/apps/) on top of a commit whose own run
      # passed changes no code, so the code has already passed the full suite.
      # It still type-checks and builds the whole site, which is what a note
      # can break, and skips the ~15 minutes of repository and browser tests.
      # Since 2026-10-03 those tests had doubled the owner's save-to-live time
      # (Obsidian Git push to deploy) from about 10 to about 20 minutes.
      # Requiring the base run's success keeps the release gate whole: a notes
      # commit on top of a failing code commit runs everything.
      - name: Decide whether this change touches only notes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_only=false
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -qE '^0+$'; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" || true)"
            outside_notes="$(printf '%s\n' "$changed" | grep -vE '^content/' | grep -vE '^$' || true)"
            app_pages="$(printf '%s\n' "$changed" | grep -E '^content/apps/' || true)"
            if [ -n "$changed" ] && [ -z "$outside_notes" ] && [ -z "$app_pages" ]; then
              passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$BASE_SHA&status=success&per_page=1" --jq '.total_count' || echo 0)"
              if [ "${passed:-0}" -gt 0 ]; then notes_only=true; fi
            fi
          fi
          echo "notes_only=$notes_only" >> "$GITHUB_OUTPUT"
          echo "Notes-only change on a passing base: $notes_only (base $BASE_SHA)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440

      - name: Protect previously published extension downloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-iconoplasm-release-history.mjs

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Verify checked-in Iconoplasm publisher authority
        run: node scripts/run-tests.mjs iconoplasm-extension.publisher-authority.test.js

      - name: Sync shared Iconoplasm assets
        run: pnpm run sync:iconoplasm-shared

      - name: Reproduce a newly added public extension package from this commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-iconoplasm-release-history.mjs --verify-new-package

      - name: Check types and style
        run: pnpm run check

      - name: Verify operation cost implementation and migration identities
        run: |
          node scripts/generate-operation-cost-migrations.mjs --check
          node scripts/generate-operation-cost-identities.mjs

      - name: Build exact HEAD before topology tests
        run: pnpm run build

      - name: Test
        id: tests
        if: ${{ steps.scope.outputs.notes_only != 'true' }}
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/repository-tests.log" 2>&1
          test_status=$?
          set -e
          python3 - "$RUNNER_TEMP/repository-tests.log" <<'PYTHON'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          selected = set(range(max(0, len(lines) - 30), len(lines)))
          for index, line in enumerate(lines):
              if re.match(r"^\s*not ok\b", line):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 80)))
          for index in sorted(selected):
              print(lines[index])
          PYTHON
          exit "$test_status"

      # B-839: the caretaker dialog is checked in a real browser (the runner's
      # installed Chrome) by geometry and computed fonts, not CSS regexes.
      # The step's limit stops a hung browser (the E2E files take about 6
      # minutes together). No --test-timeout: Node applies it to each whole
      # file too, and geneguessr-direct-structures alone runs about 310 s.
      - name: Caretaker dialog geometry (browser E2E)
        if: ${{ steps.scope.outputs.notes_only != 'true' }}
        timeout-minutes: 15
        run: node --test e2e/*.e2e.mjs

      - name: Upload E2E screenshots and measurements
        if: ${{ always() && steps.scope.outputs.notes_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.sha }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve complete test output
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: repository-tests-${{ github.sha }}
          path: ${{ runner.temp }}/repository-tests.log
          if-no-files-found: error
          retention-days: 3
