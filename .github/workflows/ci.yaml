name: Build and Test

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Sync shared Iconoplasm assets
        run: pnpm run sync:iconoplasm-shared

      - name: Apply the mutation under test
        run: |
          if [ -f probe-mutate.py ]; then python3 probe-mutate.py; git diff --stat; fi

      - name: Run the probe tests
        shell: bash
        run: |
          set +e
          node scripts/run-tests.mjs $(cat probe-files.txt) > "$RUNNER_TEMP/probe.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/probe.log" <<'PYTHON'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          selected = set(range(max(0, len(lines) - 12), len(lines)))
          for index, line in enumerate(lines):
              if re.match(r"^\s*not ok\b", line):
                  selected.update(range(max(0, index - 1), min(len(lines), index + 40)))
          for index in sorted(selected):
              print(lines[index])
          PYTHON
          echo "PROBE_EXIT=$status"
          exit "$status"
