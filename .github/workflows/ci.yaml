name: Build and Test

on:
  pull_request:
    branches:
      - main
      - v5
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Create brinedew plugin symlinks
        run: node scripts/setup-brinedew-plugins.mjs

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --from-config

      - name: Sync shared Iconoplasm assets
        run: pnpm run sync:iconoplasm-shared

      - name: Check types and style
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Ensure Quartz builds
        run: pnpm run build
