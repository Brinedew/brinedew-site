name: Build and Test

on:
  pull_request:
    branches:
      - main
      - v5
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Bump actions/checkout @v6 -> @v7 and actions/cache @v5 -> @v6 (2026
      # current majors). setup-node @v6 is already the latest. Dependabot
      # version-updates covers npm dependencies; this project explicitly pins
      # GitHub Actions to majors instead of SHA so Dependabot can PR drift.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440

      - name: Protect previously published extension downloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-iconoplasm-release-history.mjs

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Verify checked-in Iconoplasm publisher authority
        run: node scripts/run-tests.mjs iconoplasm-extension.publisher-authority.test.js

      - name: Sync shared Iconoplasm assets
        run: pnpm run sync:iconoplasm-shared

      - name: Reproduce a newly added public extension package from this commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-iconoplasm-release-history.mjs --verify-new-package

      - name: Check types and style
        run: pnpm run check

      - name: Verify operation cost implementation and migration identities
        run: |
          node scripts/generate-operation-cost-migrations.mjs --check
          node scripts/generate-operation-cost-identities.mjs --check

      - name: Build exact HEAD before topology tests
        run: pnpm run build

      - name: Test
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/repository-tests.log" 2>&1
          test_status=$?
          set -e
          python3 - "$RUNNER_TEMP/repository-tests.log" <<'PYTHON'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          selected = set(range(max(0, len(lines) - 30), len(lines)))
          for index, line in enumerate(lines):
              if re.match(r"^\s*not ok\b", line):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 80)))
          for index in sorted(selected):
              print(lines[index])
          PYTHON
          exit "$test_status"

      - name: Preserve complete test output
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: repository-tests-${{ github.sha }}
          path: ${{ runner.temp }}/repository-tests.log
          if-no-files-found: error
          retention-days: 3

      # Reader containment must never need to rebuild the corpus while D1 is
      # impaired. Preserve the exact tested static asset bundle so the separate
      # recovery job can rebind the existing state owner without replacing its
      # immutable public bytes or running enrichment.
      - name: Archive exact tested Iconoplasm static assets for recovery
        uses: actions/upload-artifact@v7
        with:
          name: iconoplasm-edge-assets-${{ github.sha }}
          path: public-iconoplasm-edge
          if-no-files-found: error
          retention-days: 1
