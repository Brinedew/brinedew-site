name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # A squash merge lands the exact tree its pull request's run tested whenever
  # main did not move in between: GitHub tests the PR's merge with main
  # (refs/pull/N/merge) and squashes the same two commits. Running the suite
  # again on that tree only repeats a verdict we have. On 2026-10-23 it was 10
  # of the 24 minutes from opening #733 to the change being live, because the
  # production deploy waits for main's run. The PR run records its tree as an
  # artifact named after it; a push whose tree matches a successful same-repo
  # PR run passes at once. Anything else (main moved, a fork PR, an API error,
  # a manual run) runs the full job below.
  tested-tree:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - name: Look for a passing pull request run of this exact tree
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reuse=false
          tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha || true)"
          if [ -n "$tree" ]; then
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-tree-$tree&per_page=20" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' || true)"
            for id in $ids; do
              # The artifact is uploaded by the run's last step, so the run may
              # still be finishing its post steps for a few seconds.
              for attempt in $(seq 1 12); do
                run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
                  --jq '[.event, .path, .head_repository.full_name, .status, (.conclusion // "")] | join(" ")' || true)"
                case "$run" in
                  "pull_request .github/workflows/ci.yaml $GITHUB_REPOSITORY completed success") reuse=true; break ;;
                  "pull_request .github/workflows/ci.yaml $GITHUB_REPOSITORY completed"*) break ;;
                  "pull_request .github/workflows/ci.yaml $GITHUB_REPOSITORY "*) sleep 10 ;;
                  *) break ;;
                esac
              done
              if [ "$reuse" = true ]; then echo "Tree $tree passed in run $id"; break; fi
            done
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "Reusing a pull request run's verdict for tree ${tree:-unknown}: $reuse"

  # Decides once for the whole run whether the change touches only notes, and
  # names the tree it tests. A blobless clone has every commit and tree, which
  # is all git diff needs, in a few seconds instead of the 45 s a full clone took.
  scope:
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      notes_only: ${{ steps.scope.outputs.notes_only }}
      tree: ${{ steps.scope.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Notes fast path: a change that only edits notes (content/, except the
      # Iconoplasm app pages in content/apps/) on top of a commit whose own run
      # passed changes no code, so the code has already passed the full suite.
      # It still type-checks and builds the whole site, which is what a note
      # can break, and skips the repository and browser tests.
      # Since 2026-10-03 those tests had doubled the owner's save-to-live time
      # (Obsidian Git push to deploy) from about 10 to about 20 minutes.
      # Requiring the base run's success keeps the release gate whole: a notes
      # commit on top of a failing code commit runs everything. If the base run
      # is still going, the step waits for its verdict instead (2026-10-12: an
      # Obsidian save two minutes after a code merge re-ran all 17 minutes).
      - name: Decide whether this change touches only notes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          notes_only=false
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -qE '^0+$'; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" || true)"
            outside_notes="$(printf '%s\n' "$changed" | grep -vE '^content/' | grep -vE '^$' || true)"
            app_pages="$(printf '%s\n' "$changed" | grep -E '^content/apps/' || true)"
            if [ -n "$changed" ] && [ -z "$outside_notes" ] && [ -z "$app_pages" ]; then
              # An Obsidian save often lands while the base commit's own run is
              # still testing. Waiting for that verdict (at most 25 minutes) is
              # never slower than running the same suites again from scratch.
              runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$BASE_SHA&per_page=20"
              for attempt in $(seq 1 50); do
                passed="$(gh api "$runs" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' || echo 0)"
                running="$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length' || echo 0)"
                if [ "${passed:-0}" -gt 0 ]; then notes_only=true; break; fi
                if [ "${running:-0}" -eq 0 ]; then break; fi
                echo "Waiting for the base commit's run to finish ($attempt)"
                sleep 30
              done
            fi
          fi
          echo "notes_only=$notes_only" >> "$GITHUB_OUTPUT"
          echo "Notes-only change on a passing base: $notes_only (base $BASE_SHA)"

  # The checks every change needs, notes included: published downloads stay
  # untouched, types and formatting pass, and the whole site builds.
  checks:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Protect previously published extension downloads
        run: node scripts/verify-iconoplasm-release-history.mjs

      - uses: ./.github/actions/setup

      # The build syncs the shared Iconoplasm assets first, which check reads.
      - name: Build exact HEAD
        run: pnpm run build

      # The build regenerates checked-in files (the extension's catalog
      # contract, Studio import versions, synced shared assets). A commit whose
      # copies are stale would pass every later step on the rebuilt ones.
      - name: Build leaves every checked-in file as committed
        run: git diff --exit-code --stat

      - name: Check types and style
        run: pnpm run check

      - name: Reproduce a newly added public extension package from this commit
        run: node scripts/verify-iconoplasm-release-history.mjs --verify-new-package

  # The repository suite in three thirds on three runners (scripts/run-tests.mjs
  # deals the files out, the slow ones first). One runner took 324 s on
  # 2026-10-28 behind about 4 minutes of setup; two took 122 s and 154 s, the
  # longest lane of a normal PR, with no file over 18 s, so a third runner
  # divides it again.
  tests:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.notes_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build exact HEAD before topology tests
        run: pnpm run build

      - name: Test
        id: tests
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/repository-tests.log" 2>&1
          test_status=$?
          set -e
          python3 - "$RUNNER_TEMP/repository-tests.log" <<'PYTHON'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          selected = set(range(max(0, len(lines) - 30), len(lines)))
          for index, line in enumerate(lines):
              if re.match(r"^\s*not ok\b", line):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 80)))
          for index in sorted(selected):
              print(lines[index])
          PYTHON
          exit "$test_status"

      - name: Preserve complete test output
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-tests-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/repository-tests.log
          if-no-files-found: error
          retention-days: 3

  # Browser E2E in the runner's installed Chrome, in three thirds. Node deals
  # the files to the thirds in name order and runs a third's files side by
  # side, so no file should run much longer than its third: the GeneGuessr
  # tests are four files because as one they took 490 s, the whole lane's wait
  # (B-1187). A run takes only the files its change can break, plus one swept
  # by run number (scripts/select-e2e.mjs). A manual run, or a change to the
  # harness, the dependencies or CI, takes them all.
  # The step's limit stops a hung browser. No --test-timeout: Node applies it
  # to each whole file too.
  e2e:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.notes_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup

      - name: Build exact HEAD
        run: pnpm run build

      - name: Browser E2E
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event_name != 'workflow_dispatch' && (github.event.pull_request.base.sha || github.event.before) || '' }}
          SHARD: ${{ matrix.shard }}/3
        run: |
          files="$(node scripts/select-e2e.mjs --base "$BASE_SHA" --rotate "$GITHUB_RUN_NUMBER")"
          echo "E2E files: $files"
          node --test --test-shard="$SHARD" $files

      - name: Upload E2E screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.sha }}-${{ matrix.shard }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 7

  # The one required check. Branch protection names build-and-test, so the
  # lanes above can change without touching the rule. It passes when the
  # tested-tree job reused a verdict, or when every lane this change needs
  # passed. A pull request run that passes records its tree for that reuse;
  # HEAD is GitHub's merge of the PR with main, the tree the merge will land.
  build-and-test:
    needs: [tested-tree, scope, checks, tests, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        shell: bash
        env:
          REUSE: ${{ needs.tested-tree.outputs.reuse }}
          SCOPE: ${{ needs.scope.result }}
          NOTES_ONLY: ${{ needs.scope.outputs.notes_only }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "reuse=$REUSE scope=$SCOPE notes_only=$NOTES_ONLY checks=$CHECKS tests=$TESTS e2e=$E2E"
          if [ "$REUSE" = true ]; then exit 0; fi
          [ "$SCOPE" = success ] && [ "$CHECKS" = success ] || exit 1
          if [ "$NOTES_ONLY" = true ]; then exit 0; fi
          [ "$TESTS" = success ] && [ "$E2E" = success ]

      - name: Record the tree this pull request run tested
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TREE: ${{ needs.scope.outputs.tree }}
        run: printf '%s\n' "$TREE" > "$RUNNER_TEMP/tested-tree"

      - name: Upload the tested tree
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ needs.scope.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree
          if-no-files-found: error
          retention-days: 7
