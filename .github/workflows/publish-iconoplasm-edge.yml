name: Publish Iconoplasm Edge extension

# Public-repo hygiene: keep private Partner Center / AMO / Chrome dashboard
# investigation notes out of this workflow. Detailed store handoff belongs in
# the private tracker and local workstation code, not in public release automation.
# Never write secret values into this workflow, docs, logs, Linear, commits, or
# artifacts.

# Store publish is deliberately workflow_dispatch-only. The supported trigger
# surface is the local Iconoplasm GUI's human release gate, not pushes, cron, or
# unattended LLM/CLI automation.
on:
  workflow_dispatch:
    inputs:
      human_confirmation:
        description: "Type exactly: YES, I AM A HUMAN, PUBLISH ICONOPLASM"
        required: true
        type: string
      expected_version:
        description: Version declared by the human publisher authority
        required: true
        type: string
      expected_commit:
        description: Exact source commit approved by the Iconoplasm GUI
        required: true
        type: string
      certification_notes:
        description: Notes for Microsoft Edge Add-ons certification
        required: false
        default: "Iconoplasm extension update submitted from the Iconoplasm GUI human release gate."
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  # Firefox and Edge consume one immutable archive. Keep the whole publish
  # transaction serial so both callers cannot create the same draft together.
  group: iconoplasm-store-release-${{ inputs.expected_version }}
  cancel-in-progress: false

jobs:
  prepare-release:
    uses: ./.github/workflows/prepare-iconoplasm-release.yml
    with:
      expected_version: ${{ inputs.expected_version }}
      expected_commit: ${{ inputs.expected_commit }}
      human_confirmation: ${{ inputs.human_confirmation }}
  publish-edge:
    needs: prepare-release
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # Re-platformed from windows-latest to ubuntu-latest. PowerShell 7 is
    # preinstalled on GitHub-hosted Linux runners, and the only Win32-shaped
    # calls in this workflow (Invoke-WebRequest, Invoke-RestMethod, Get-FileHash,
    # ConvertFrom-Json) are cross-platform on PS7. This cuts billable minutes
    # roughly in half and avoids windows-2022 vs windows-2025 runner-image
    # churn that has broken PowerShell steps in 2025-2026.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    env:
      EDGE_PRODUCT_ID: b8547df3-4156-4b56-b7dc-3752347b6794
      EDGE_API_ROOT: https://api.addons.microsoftedge.microsoft.com
    steps:
      # Bump actions/checkout @v4 -> @v7 and actions/setup-node @v4 -> @v6
      # (2026 current majors).
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Confirm human publish intent
        env:
          HUMAN_CONFIRMATION: ${{ inputs.human_confirmation }}
        run: |
          if ($env:HUMAN_CONFIRMATION -ne "YES, I AM A HUMAN, PUBLISH ICONOPLASM") {
            throw "Edge store publish requires the exact human confirmation phrase from the Iconoplasm GUI."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable

      - name: Check Edge API secrets
        run: |
          if (-not "${{ secrets.EDGE_ADDONS_CLIENT_ID }}") {
            throw 'Missing GitHub secret EDGE_ADDONS_CLIENT_ID'
          }
          if (-not "${{ secrets.EDGE_ADDONS_API_KEY }}") {
            throw 'Missing GitHub secret EDGE_ADDONS_API_KEY'
          }

      - name: Verify human publisher authority
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node ./scripts/verify-iconoplasm-publisher-authority.mjs --expected="$env:EXPECTED_VERSION"
          $manifest = Get-Content iconoplasm-extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.background.scripts) {
            throw "Edge MV3 packages must use background.service_worker, not background.scripts."
          }
          if (-not $manifest.background.service_worker) {
            throw "Edge MV3 package is missing background.service_worker."
          }

      - name: Require successful Build and Test for this release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/wait-for-iconoplasm-release-ci.mjs

      - name: Require a certified Edge PDF ownership adapter
        run: node ./scripts/verify-iconoplasm-pdf-release-gate.mjs --target=edge

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify the sealed release bundles
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: node ./scripts/iconoplasm-release-bundle.mjs download

      - name: Submit package to Edge Add-ons draft
        id: edge_upload
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $headers = @{
            Authorization = "ApiKey $env:EDGE_API_KEY"
            'X-ClientID' = $env:EDGE_CLIENT_ID
            'Content-Type' = 'application/zip'
          }
          $zipPath = "iconoplasm-extension/dist/iconoplasm-edge-v$env:EXPECTED_VERSION.zip"
          if (-not (Test-Path $zipPath)) {
            throw "Expected Edge package does not exist: $zipPath"
          }
          $packageHash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash
          Write-Host "Uploading Edge package $zipPath ($((Get-Item $zipPath).Length) bytes, sha256 $packageHash)"
          $response = Invoke-WebRequest `
            -Uri "$env:EDGE_API_ROOT/v1/products/$env:EDGE_PRODUCT_ID/submissions/draft/package" `
            -Method Post `
            -Headers $headers `
            -InFile $zipPath
          if ($response.StatusCode -ne 202) {
            throw "Edge package upload returned HTTP $($response.StatusCode)."
          }
          $operationLocation = [string]$response.Headers.Location
          if (-not $operationLocation) {
            throw "Edge package upload did not return an operation Location header."
          }
          Write-Host "Edge package upload accepted. Operation ID: $operationLocation"
          "operation_id=$operationLocation" >> $env:GITHUB_OUTPUT

      - name: Wait for Edge package validation
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          OPERATION_ID: ${{ steps.edge_upload.outputs.operation_id }}
        run: |
          $headers = @{
            Authorization = "ApiKey $env:EDGE_API_KEY"
            'X-ClientID' = $env:EDGE_CLIENT_ID
          }
          $operationId = [string]$env:OPERATION_ID
          if (-not $operationId) {
            throw "Edge package validation is missing the operation ID returned by the package upload."
          }
          $operationUri = "$env:EDGE_API_ROOT/v1/products/$env:EDGE_PRODUCT_ID/submissions/draft/package/operations/$operationId"
          for ($i = 0; $i -lt 60; $i++) {
            $status = Invoke-RestMethod -Uri $operationUri -Headers $headers -Method Get
            $state = [string]($status.status ?? $status.Status ?? $status.operationStatus ?? '')
            $json = $status | ConvertTo-Json -Depth 20
            Write-Host $json
            if ($state -match '^(Succeeded|succeeded|Success|success|Completed|completed)$') { exit 0 }
            if ($state -match '^(Failed|failed|Error|error)$') { throw "Edge package validation failed: $json" }
            Start-Sleep -Seconds 10
          }
          throw "Timed out waiting for Edge package validation."

      - name: Publish Edge draft submission
        id: edge_publish
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          CERTIFICATION_NOTES: ${{ inputs.certification_notes }}
        run: |
          $headers = @{
            Authorization = "ApiKey $env:EDGE_API_KEY"
            'X-ClientID' = $env:EDGE_CLIENT_ID
            'Content-Type' = 'application/json'
          }
          $body = @{ notes = [string]$env:CERTIFICATION_NOTES } | ConvertTo-Json -Depth 4
          $response = Invoke-WebRequest `
            -Uri "$env:EDGE_API_ROOT/v1/products/$env:EDGE_PRODUCT_ID/submissions" `
            -Method Post `
            -Headers $headers `
            -Body $body
          if ($response.StatusCode -ne 202) {
            throw "Edge publish returned HTTP $($response.StatusCode)."
          }
          $operationLocation = [string]$response.Headers.Location
          if (-not $operationLocation) {
            throw "Edge publish did not return an operation Location header."
          }
          Write-Host "Edge publish accepted. Operation ID: $operationLocation"
          "operation_id=$operationLocation" >> $env:GITHUB_OUTPUT

      - name: Wait for Edge publish operation
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          OPERATION_ID: ${{ steps.edge_publish.outputs.operation_id }}
        run: |
          $headers = @{
            Authorization = "ApiKey $env:EDGE_API_KEY"
            'X-ClientID' = $env:EDGE_CLIENT_ID
          }
          $operationId = [string]$env:OPERATION_ID
          if (-not $operationId) {
            throw "Edge publish wait is missing the operation ID returned by the publish request."
          }
          $operationUri = "$env:EDGE_API_ROOT/v1/products/$env:EDGE_PRODUCT_ID/submissions/operations/$operationId"
          for ($i = 0; $i -lt 60; $i++) {
            $status = Invoke-RestMethod -Uri $operationUri -Headers $headers -Method Get
            $state = [string]($status.status ?? $status.Status ?? $status.operationStatus ?? '')
            $json = $status | ConvertTo-Json -Depth 20
            Write-Host $json
            if ($state -match '^(Succeeded|succeeded|Success|success|Completed|completed)$') { exit 0 }
            if ($state -match '^(Failed|failed|Error|error)$') {
              $errorCode = [string]($status.errorCode ?? '')
              if ($errorCode -eq 'InProgressSubmission') {
                throw "Edge publish is blocked because Microsoft already has a submission in progress for this product. The package upload and package validation succeeded; wait for the active Partner Center review to finish or resolve it in Partner Center, then rerun this Edge workflow. Operation response: $json"
              }
              throw "Edge publish failed: $json"
            }
            Start-Sleep -Seconds 10
          }
          throw "Timed out waiting for Edge publish operation."

      # Bump actions/upload-artifact @v4 -> @v7 (2026 current major). v4 was
      # not the GH13-deprecated line, but pinning to the current major is
      # what every other workflow in this repo now does.
      - name: Upload Edge zip
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iconoplasm-edge-package
          path: iconoplasm-extension/dist/iconoplasm-edge-v*.zip
          if-no-files-found: error
