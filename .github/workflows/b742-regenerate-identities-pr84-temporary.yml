name: Temporary B-742 PR84 Identity Generator

on:
  push:
    branches: ["fix/b742-quarantine-export-gamesession"]
    paths:
      - ".github/workflows/b742-regenerate-identities-pr84-temporary.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/b742-quarantine-export-gamesession
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          node scripts/generate-operation-cost-identities.mjs
          node scripts/generate-operation-cost-identities.mjs --check
          git config user.name "Brinedew CI"
          git config user.email "brinedew@proton.me"
          git add workers/generated/operation-cost-identities.js
          if git diff --cached --quiet; then
            echo "Operation-cost identities already current."
            exit 0
          fi
          git commit -m "Refresh identities for GameSession quarantine export"
          git push origin HEAD:fix/b742-quarantine-export-gamesession
