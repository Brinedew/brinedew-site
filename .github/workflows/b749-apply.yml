name: B-749 commit and verify scoped source

on:
  push:
    branches:
      - fix/b749-reject-global-read-model-sync

permissions:
  contents: write

concurrency:
  group: b749-source-transport
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[b749-apply-stage]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Use the ordinary CI dependency policy
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440
          test -f package.json
          pnpm install --frozen-lockfile --config.block-exotic-subdeps=false
      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only
      - name: Apply the reviewed runtime and concurrency corrections
        run: python3 .github/b749-v4-apply.py
      - name: Format committed source and regenerate cost identities
        run: |
          pnpm exec prettier --write workers/iconoplasm-stateful-runtime-inside-the-only-allowed-internal-worker-do-not-duplicate.js workers/iconoplasm/sync-finalization-publication.js workers/iconoplasm/sync-finalization-publication.test.js workers/iconoplasm/sync-finalization-scoped-core.test.js workers/iconoplasm.sync-finalization-queue.test.js workers/iconoplasm.vote-authority-demand-handover.test.js workers/iconoplasm.b749-scoped-reset.test.js workers/iconoplasm.finalization-reset-alarm.test.js workers/iconoplasm.vote-reset-wake.test.js workers/iconoplasm.daily-budget-kill-switch.test.js
          node scripts/generate-operation-cost-identities.mjs
          node scripts/generate-operation-cost-identities.mjs --check
      - name: Exercise scoped finalization and real owner regressions
        shell: bash
        run: |
          set +e
          node --test workers/iconoplasm/sync-finalization-scoped-core.test.js workers/iconoplasm.sync-finalization-queue.test.js workers/iconoplasm.vote-authority-demand-handover.test.js workers/iconoplasm.b749-scoped-reset.test.js workers/iconoplasm.vote-authority-demand-cold-first-use.test.js workers/iconoplasm.vote-authority-handoff.test.js workers/iconoplasm.vote-authority-slice.test.js workers/iconoplasm.vote-reset-wake.test.js > "$RUNNER_TEMP/b749-focused.log" 2>&1
          status=$?
          tail -n 140 "$RUNNER_TEMP/b749-focused.log"
          exit "$status"
      - name: Commit normal source and delete temporary patch delivery files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/b749-reject-global-read-model-sync
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git ls-files -z '.github/b749-*' '.github/workflows/b749-*' | xargs -0 git rm -f --
          git add -u
          git config user.name 'Brinedew'
          git config user.email 'brinedew@proton.me'
          git commit -m 'fix(B-749): commit scoped V2 handoff and preserve concurrent accepted work'
          git push origin HEAD:fix/b749-reject-global-read-model-sync
          git rev-parse HEAD > "$RUNNER_TEMP/b749-source-commit.txt"
          git show --stat HEAD
      - name: Check types and style on the committed source
        run: pnpm run check
      - name: Verify generated identities on the committed source
        run: |
          node scripts/generate-operation-cost-migrations.mjs --check
          node scripts/generate-operation-cost-identities.mjs --check
      - name: Run the complete unchanged repository test command
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/b749-full-tests.log" 2>&1
          status=$?
          tail -n 180 "$RUNNER_TEMP/b749-full-tests.log"
          exit "$status"
      - name: Build
        run: pnpm run build
      - name: Preserve exact source identity and complete test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b749-source-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/b749-source-commit.txt
            ${{ runner.temp }}/b749-focused.log
            ${{ runner.temp }}/b749-full-tests.log
          if-no-files-found: warn
          retention-days: 3
