name: Check Bunny balance

# B-1087: Bunny is prepaid with auto-recharge off, and takes the portraits, blots and stable gene
# objects offline four days after the balance goes negative. This run fails, and GitHub emails
# the owner, while the balance covers fewer than three months (scripts/check-bunny-balance.mjs).
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the Bunny balance
        env:
          ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
        run: node scripts/check-bunny-balance.mjs
