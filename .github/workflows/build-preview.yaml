name: Build Preview Deployment

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  build-preview:
    runs-on: ubuntu-latest
    name: Build Preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm config set minimumReleaseAge 1440

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Sync shared Iconoplasm assets
        run: pnpm run sync:iconoplasm-shared

      - name: Build Quartz
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-build
          path: public
