name: B-742 Hard Pre-reset D1 Quarantine

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/b742-hard-pre-reset-d1-quarantine.yml"
      - "workers/b742-quarantine-gene-shell-inside-the-only-allowed-stateful-worker-do-not-duplicate.js"
  schedule:
    # Reassert immediately before the 00:00 UTC D1 reset in case any intervening
    # operator action replaced the transition-only Worker version.
    - cron: "58 23 * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: b742-hard-pre-reset-d1-quarantine
  cancel-in-progress: false

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICONOPLASM_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ICONOPLASM_ADMIN_TOKEN: ${{ secrets.ICONOPLASM_ADMIN_TOKEN }}
      SCRIPT_NAME: geneguessr-api
    steps:
      - name: Refuse use outside the B-742 incident window
        shell: bash
        run: |
          set -euo pipefail
          utc_hour="$(date -u +%H)"
          utc_minute="$(date -u +%M)"
          utc_minute_of_day=$((10#${utc_hour} * 60 + 10#${utc_minute}))
          # The hard quarantine is allowed only across the reset boundary, every day.
          # An absolute calendar deadline would silently disable the next reset.
          if (( utc_minute_of_day > 5 && utc_minute_of_day < 1435 )); then
            echo "B-742 hard quarantine window is closed; refusing to alter production."
            exit 78
          fi

      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require successful protected CI for this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-iconoplasm-release-ci.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ICONOPLASM_ADMIN_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required credential: ${name}" >&2
              exit 1
            fi
          done

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install --enabled-only

      - name: Build the canonical static asset bundle required by the stateful Worker
        run: pnpm run build

      - name: Stage the existing schema-transition fence without touching D1
        shell: bash
        run: |
          set -euo pipefail
          source_config="wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml"
          quarantine_config="wrangler.b742-hard-quarantine.generated.toml"
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs"

          const source = "wrangler.the-only-allowed-internal-stateful-worker-do-not-duplicate.toml"
          const output = "wrangler.b742-hard-quarantine.generated.toml"
          const original = readFileSync(source, "utf8")
          const expected = 'main = "workers/the-only-allowed-internal-stateful-worker-runtime-do-not-duplicate.js"'
          const replacement = 'main = "workers/b742-quarantine-gene-shell-inside-the-only-allowed-stateful-worker-do-not-duplicate.js"'
          if (!original.includes(expected)) throw new Error("Canonical stateful Worker main entrypoint changed")
          const updated = original.replace(expected, replacement)
          if (updated === original || updated.includes(expected)) throw new Error("Failed to replace exactly the canonical Worker main entrypoint")
          writeFileSync(output, updated)
          NODE
          trap 'rm -f "${quarantine_config}"' EXIT
          grep -F 'main = "workers/b742-quarantine-gene-shell-inside-the-only-allowed-stateful-worker-do-not-duplicate.js"' "${quarantine_config}"
          pnpm exec wrangler deploy \
            --env="" \
            --config "${quarantine_config}" \
            --var "ICONOPLASM_SCHEMA_TRANSITION:1" \
            --var "ICONOPLASM_SCHEMA_TRANSITION_MODE:reader-recovery" \
            --var "ICONOPLASM_HTML_SHELL_CACHE_VERSION:${GITHUB_SHA}-b742-hard-quarantine"

      - name: Reassert provider-side Cron and Queue quarantine after Wrangler reconciliation
        shell: bash
        run: |
          set -euo pipefail
          safe_crons='[
            {"cron":"55 23 * * *"},
            {"cron":"3 0 * * *"},
            {"cron":"6 12 * * *"}
          ]'

          cf_rest() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local args=(
              -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30
              -X "${method}"
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
              -H "Accept: application/json"
            )
            if [[ -n "${body}" ]]; then
              args+=(-H "Content-Type: application/json" --data "${body}")
            fi
            local response
            response="$(curl "${args[@]}" "https://api.cloudflare.com/client/v4/${path}")"
            jq -e '.success == true' <<<"${response}" >/dev/null || {
              jq -c '{errors,messages}' <<<"${response}" >&2 || true
              return 1
            }
            printf '%s' "${response}"
          }

          cf_rest PUT \
            "accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/schedules" \
            "${safe_crons}" >/dev/null

          for queue in \
            iconoplasm-sync-finalization \
            iconoplasm-vote-projection \
            iconoplasm-gene-card-materialization; do
            pnpm exec wrangler queues pause-delivery "${queue}"
          done

          schedules="$(cf_rest GET "accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/schedules")"
          actual_crons="$(jq -c '[.result.schedules[].cron] | sort' <<<"${schedules}")"
          expected_crons='["3 0 * * *","55 23 * * *","6 12 * * *"]'
          if [[ "${actual_crons}" != "${expected_crons}" ]]; then
            echo "Unexpected production Cron set after quarantine: ${actual_crons}" >&2
            exit 1
          fi

          queues="$(cf_rest GET "accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?per_page=100")"
          for queue in \
            iconoplasm-sync-finalization \
            iconoplasm-vote-projection \
            iconoplasm-gene-card-materialization; do
            paused="$(jq -r --arg q "${queue}" '[.result[] | select(.queue_name == $q)] | if length == 1 then .[0].settings.delivery_paused else null end' <<<"${queues}")"
            if [[ "${paused}" != "true" ]]; then
              echo "Queue ${queue} is not verifiably paused after quarantine." >&2
              exit 1
            fi
          done

      - name: Prove application D1 is closed while public gene pages remain readable
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          gene_file="$(mktemp)"
          api_file="$(mktemp)"
          trap 'rm -f "${response_file}" "${gene_file}" "${api_file}"' EXIT

          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "${response_file}" -w '%{http_code}' \
            "https://iconoplasm.brinedew.bio/api/iconoplasm/authority/events")"
          if [[ "${status}" != "503" ]] || ! jq -e '.code == "ICONOPLASM_SCHEMA_TRANSITION"' "${response_file}" >/dev/null; then
            echo "Live application API is not behind the schema-transition fence: HTTP ${status}" >&2
            cat "${response_file}" >&2
            exit 1
          fi

          api_status="$(curl -sS --connect-timeout 10 --max-time 30 -o "${api_file}" -w '%{http_code}' \
            "https://iconoplasm.brinedew.bio/api/iconoplasm/site/genes/TP53")"
          if [[ "${api_status}" != "200" ]] || ! jq -e '.symbol == "TP53" and .detail_availability.source == "published_card_catalog" and (.portrait_candidates | length == 0)' "${api_file}" >/dev/null; then
            echo "Published-card reader API is not serving real TP53 content: HTTP ${api_status}" >&2
            cat "${api_file}" >&2
            exit 1
          fi

          gene_status="$(curl -sS --connect-timeout 10 --max-time 30 -o "${gene_file}" -w '%{http_code}' \
            "https://iconoplasm.brinedew.bio/gene/TP53")"
          if [[ "${gene_status}" != "200" ]] || ! grep -Fq 'data-icono-server-rendered-gene="true"' "${gene_file}" || ! grep -Fq 'class="icono-card-semantic-profile"' "${gene_file}" || grep -Fq 'data-b742-d1-free-gene-shell' "${gene_file}"; then
            echo "Public TP53 gene page is not readable through the published-card reader: HTTP ${gene_status}" >&2
            exit 1
          fi

          node --input-type=module -e '
            import { verifyReleaseAuthentication } from "./scripts/preflight-operation-cost-release.mjs";
            await verifyReleaseAuthentication({ token: process.env.ICONOPLASM_ADMIN_TOKEN });
          '

          echo "B-742 reader recovery verified live: application D1 is closed, published TP53 content is readable without D1, admission remains reachable, Iconoplasm Cron is absent, and all Iconoplasm Queues are paused."
